  /* Compact text wrap untuk message box kecil */
  wrapTextCompact(text,x,y,maxW,lineH){
    const c=this.ctx;const words=text.split(' ');let line='',yy=y;let lines=0;
    for(const w of words){
      const test=line?line+' '+w:w;
      if(c.measureText(test).width>maxW){
        c.fillText(line,x,yy);
        yy+=lineH;lines++;
        line=w;
        if(lines>=2)break;
      }else line=test;
    }
    if(line&&lines<2)c.fillText(line,x,yy);
  }

  updateMenu(){
    const p=this.player;
    const TC=6;
    if(this.menuTab===4 && this.classSubTab!==0){
      if(this.input.pressed('b')){this.classSubTab=0;this.classSelect=0;return;}
      if(this.input.pressed('left')){this.classSubTab=(this.classSubTab===1)?2:1;this.classSelect=0;return;}
      if(this.input.pressed('right')){this.classSubTab=(this.classSubTab===1)?2:1;this.classSelect=0;return;}
      if(this.input.pressed('m')){this.state='worldmap';this.wmContinentIdx=this._contIdx(p.currentLocation);this.wmLocationIdx=0;return;}
      this.updateClassSubTab();
      return;
    }
    if(this.input.pressed('left')){this.menuTab=(this.menuTab+TC-1)%TC;this._resetSelects();return;}
    if(this.input.pressed('right')){this.menuTab=(this.menuTab+1)%TC;this._resetSelects();return;}
    if(this.input.pressed('b')){this.state='world';return;}
    if(this.input.pressed('m')){this.state='worldmap';this.wmContinentIdx=this._contIdx(p.currentLocation);this.wmLocationIdx=0;return;}
    if(this.menuTab===0){
      if(this.input.pressed('up'))this.statSelect=(this.statSelect+STAT_KEYS.length-1)%STAT_KEYS.length;
      if(this.input.pressed('down'))this.statSelect=(this.statSelect+1)%STAT_KEYS.length;
      if(this.input.pressed('a')){
        const key=STAT_KEYS[this.statSelect];
        if(p.statPoints<=0)this.showToast('Tidak ada stat point!');
        else if(p.allocateStat(key)){this.showToast(`+1 ${STAT_LABELS[key]}`);saveGame(this.player);}
      }
      return;
    }
    if(this.menuTab===1){
      const list=Object.keys(p.skills).filter(id=>SKILL_DB[id]);
      if(list.length===0)return;
      this.skillSelect=clamp(this.skillSelect,0,list.length-1);
      if(this.input.pressed('up'))this.skillSelect=(this.skillSelect+list.length-1)%list.length;
      if(this.input.pressed('down'))this.skillSelect=(this.skillSelect+1)%list.length;
      if(this.input.pressed('a')){
        const id=list[this.skillSelect];const db=SKILL_DB[id];
        if(p.upgradeSkill(id)){this.showToast(`${db.name} → Lv ${p.skills[id]}`);saveGame(this.player);}
        else this.showToast(p.skillPoints<=0?'Tidak ada skill point':'Tidak bisa upgrade');
      }
      return;
    }
    if(this.menuTab===2){
      const inv=p.sortedInventory(SORT_MODES[this.sortMode]);
      const total=1+inv.length;
      this.itemSelect=clamp(this.itemSelect,0,total-1);
      if(this.input.pressed('up'))this.itemSelect=(this.itemSelect+total-1)%total;
      if(this.input.pressed('down'))this.itemSelect=(this.itemSelect+1)%total;
      if(this.input.pressed('a')){
        if(this.itemSelect===0){this.sortMode=(this.sortMode+1)%SORT_MODES.length;this.itemSelect=0;this.showToast('Sort: '+SORT_LABELS[SORT_MODES[this.sortMode]]);}
        else{
          const it=inv[this.itemSelect-1];if(!it)return;
          const db=ITEM_DB[it.id];if(!db)return;
          if(db.slot){
            const r=p.equip(it.id);
            if(r.ok){this.showToast(`Equip: ${db.name}`);saveGame(this.player);}
            else if(r.reason==='class')this.showToast(`${p.classData.name} tidak bisa pakai ${db.name}!`);
          }
          else if(db.type==='heal'){const v=p.healHp(Math.floor(db.value*p._secondBonus('potionEffect')));p.removeItem(it.id,1);this.showToast(`${db.name} +${v} HP`);saveGame(this.player);}
          else if(db.type==='mana'){const v=p.healMp(Math.floor(db.value*p._secondBonus('potionEffect')));p.removeItem(it.id,1);this.showToast(`${db.name} +${v} MP`);saveGame(this.player);}
          else if(db.type==='fullheal'){p.hp=p.maxHp;p.removeItem(it.id,1);this.showToast('HP penuh!');saveGame(this.player);}
          else if(db.type==='damage')this.showToast('Hanya di battle!');
        }
      }
      return;
    }
    if(this.menuTab===3){
      const list=SLOT_ORDER;
      this.equipSelect=clamp(this.equipSelect,0,list.length-1);
      if(this.input.pressed('up'))this.equipSelect=(this.equipSelect+list.length-1)%list.length;
      if(this.input.pressed('down'))this.equipSelect=(this.equipSelect+1)%list.length;
      if(this.input.pressed('a')){
        const slot=list[this.equipSelect];
        if(p.equipment[slot]){if(p.unequip(slot)){this.showToast(`Unequip ${SLOT_LABEL[slot]}`);saveGame(this.player);}}
        else this.showToast('Kosong');
      }
      return;
    }
    if(this.menuTab===4){
      if(this.input.pressed('a')){this.classSubTab=1;this.classSelect=0;return;}
      if(this.input.pressed('down')){this.classSubTab=2;this.classSelect=0;return;}
      return;
    }
    if(this.menuTab===5){
      if(this.input.pressed('a')){this.state='craft';this.craftTab=0;this.craftIndex=0;}
      return;
    }
  }

  updateClassSubTab(){
    const p=this.player;
    if(this.classSubTab===1){
      const evos=evolutionPathsFrom(p.classId);
      if(evos.length===0){if(this.input.pressed('a'))this.showToast('Tidak ada evolusi tersedia');return;}
      this.classSelect=clamp(this.classSelect,0,evos.length-1);
      if(this.input.pressed('up'))this.classSelect=(this.classSelect+evos.length-1)%evos.length;
      if(this.input.pressed('down'))this.classSelect=(this.classSelect+1)%evos.length;
      if(this.input.pressed('a')){
        const target=evos[this.classSelect];const tier=target.evolvesFrom.length>=2?2:1;const req=evoRequirement(tier);
        if(p.level<req.lvl){this.showToast(`Butuh Lv.${req.lvl} untuk evolusi!`);return;}
        if(p.currency<req.cost){this.showToast(`Butuh ${fmtCurrency(req.cost)} untuk evolusi!`);return;}
        p.currency-=req.cost;p.classId=target.id;
        const s1=target.skills[0];if(s1&&!p.skills[s1])p.skills[s1]=1;
        this.showToast(`⭐ Evolusi! → ${target.name}`,2.5);saveGame(p);this.classSubTab=0;this.classSelect=0;
      }
      return;
    }
    if(this.classSubTab===2){
      const curList=SECOND_CLASSES;
      this.classSelect=clamp(this.classSelect,0,curList.length-1);
      if(this.input.pressed('up'))this.classSelect=(this.classSelect+curList.length-1)%curList.length;
      if(this.input.pressed('down'))this.classSelect=(this.classSelect+1)%curList.length;
      if(this.input.pressed('a')){
        if(p.secondClassId){this.showToast('Second class sudah dipilih permanen!');return;}
        if(p.level<10){this.showToast('Butuh Lv.10 untuk pilih second class');return;}
        const target=curList[this.classSelect];
        p.secondClassId=target.id;p.secondLevel=1;p.secondExp=0;
        this.showToast(`🎯 Second class → ${target.name}`,2.5);saveGame(p);this.classSubTab=0;
      }
      return;
    }
  }

  _resetSelects(){
    if(this.menuTab===0)this.statSelect=0;
    else if(this.menuTab===1)this.skillSelect=0;
    else if(this.menuTab===2)this.itemSelect=0;
    else if(this.menuTab===3)this.equipSelect=0;
    else if(this.menuTab===4){this.classSelect=0;this.classSubTab=0;}
    else if(this.menuTab===5){this.craftIndex=0;this.craftTab=0;}
  }

  renderMenu(){
    const c=this.ctx,p=this.player;
    c.fillStyle='rgba(0,0,0,0.85)';c.fillRect(0,0,VIEW_W,VIEW_H);
    const boxX=10,boxY=10,boxW=VIEW_W-20,boxH=VIEW_H-20;
    const panelG=c.createLinearGradient(boxX,boxY,boxX+boxW,boxY+boxH);
    panelG.addColorStop(0,'rgba(15,20,45,0.98)');panelG.addColorStop(1,'rgba(8,10,25,0.98)');
    c.fillStyle=panelG;c.beginPath();c.roundRect(boxX,boxY,boxW,boxH,14);c.fill();
    c.strokeStyle='rgba(120,160,255,0.6)';c.lineWidth=2;c.stroke();
    c.strokeStyle='rgba(255,255,255,0.1)';c.lineWidth=1;
    c.beginPath();c.roundRect(boxX+2,boxY+2,boxW-4,34,12);c.stroke();
    const tabs=['STATUS','SKILL','ITEM','EQUIP','CLASS','CRAFT'];
    const tabW=boxW/tabs.length;
    for(let i=0;i<tabs.length;i++){
      const tx=boxX+i*tabW;

    }

    if(this.menuTab===0)this.renderStatusTab(boxX,boxY,boxW,boxH);
    else if(this.menuTab===1)this.renderSkillsTab(boxX,boxY,boxW,boxH);
    else if(this.menuTab===2)this.renderItemsTab(boxX,boxY,boxW,boxH);
    else if(this.menuTab===3)this.renderEquipTab(boxX,boxY,boxW,boxH);
    else if(this.menuTab===4)this.renderClassTab(boxX,boxY,boxW,boxH);
    else this.renderCraftTab(boxX,boxY,boxW,boxH);
    c.fillStyle='#888';c.font='bold 10px system-ui';c.textAlign='center';
    let hint='◀▶tab · ▲▼pilih · A aksi · B tutup';
    if(this.menuTab===0)hint='▲▼pilih stat · A allocate point';
    if(this.menuTab===4){
      if(this.classSubTab===0)hint='A→EVO · ▼→2ND · ◀▶ ganti tab';
      else hint='◀▶ switch EVO/2ND · A pilih · B kembali';
    }
    c.fillText(hint,VIEW_W/2,boxY+boxH-6);c.textAlign='left';
  }
  renderStatusTab(bx,by,bw,bh){

  renderSkillsTab(bx,by,bw,bh){

  renderItemsTab(bx,by,bw,bh){
    const c=this.ctx,p=this.player;
    const y0=by+50;const sortSel=this.itemSelect===0;
    if(sortSel){
      const sg=c.createLinearGradient(bx+6,y0-16,bx+bw-6,y0+8);
      sg.addColorStop(0,'rgba(255,226,122,0.3)');sg.addColorStop(1,'rgba(255,180,60,0.1)');
      c.fillStyle=sg;c.beginPath();c.roundRect(bx+6,y0-16,bw-12,24,6);c.fill();
      c.strokeStyle='#ffe27a';c.lineWidth=1;c.stroke();
    }
    c.textAlign='left';c.font='bold 12px system-ui';c.fillStyle=sortSel?'#ffe27a':'#ccc';
    c.fillText(`Sort: ${SORT_LABELS[SORT_MODES[this.sortMode]]}`,bx+14,y0);
    c.textAlign='right';c.fillStyle='#ffd700';c.fillText(fmtCurrency(p.currency),bx+bw-14,y0);c.textAlign='left';
    c.fillStyle='rgba(255,255,255,0.15)';c.fillRect(bx+8,y0+10,bw-16,1);
    const inv=p.sortedInventory(SORT_MODES[this.sortMode]);
    const startY=y0+28,rowH=30;
    if(inv.length===0){c.fillStyle='#888';c.font='12px system-ui';c.textAlign='center';c.fillText('Inventory kosong',VIEW_W/2,startY+40);c.textAlign='left';return;}
    const maxRows=Math.floor((by+bh-startY-20)/rowH);let startIdx=0;
    if(this.itemSelect-1>=maxRows)startIdx=this.itemSelect-maxRows;
    for(let i=0;i<inv.length;i++){
      const it=inv[i],db=ITEM_DB[it.id];if(!db)continue;
      const dispIdx=i-startIdx;if(dispIdx<0||dispIdx>=maxRows)continue;
      const ry=startY+dispIdx*rowH;const sel=(this.itemSelect-1)===i;
      const mismatch=db.slot==='weapon'&&db.wtype&&db.wtype!==p.classData.weaponType;
      if(sel){
        const sg=c.createLinearGradient(bx+6,ry-12,bx+bw-6,ry+16);
        sg.addColorStop(0,'rgba(74,106,201,0.4)');sg.addColorStop(1,'rgba(50,80,160,0.2)');
        c.fillStyle=sg;c.beginPath();c.roundRect(bx+6,ry-12,bw-12,28,6);c.fill();
        c.strokeStyle='#7a9cff';c.lineWidth=1.5;c.stroke();
      }

  openShop(){this.state='shop';this.shopTab=0;this.shopIndex=0;}
  shopStock(){
    const plv=this.player.level;
    const minLv=Math.max(1,plv-15);const maxLv=plv+20;
    const cap=Math.floor((plv+5)*80);
    const wt=this.player.classData.weaponType;
    const catOrder=id=>{const db=ITEM_DB[id];if(db.slot==='weapon')return 0;if(db.slot)return 1+SLOT_ORDER.indexOf(db.slot);return 10;};
    const all=Object.keys(ITEM_DB).filter(id=>{
      const db=ITEM_DB[id];if(!db)return false;
      if(db.price>cap)return false;
      if(db.level&&(db.level<minLv||db.level>maxLv))return false;
      return true;
    }).sort((a,b)=>{
      const da=ITEM_DB[a],dbb=ITEM_DB[b];const ca=catOrder(a),cb=catOrder(b);
      if(ca!==cb)return ca-cb;
      if(ca===0){const ma=da.wtype===wt?0:1,mb=dbb.wtype===wt?0:1;if(ma!==mb)return ma-mb;}
      return da.price-dbb.price;
    });
    return all.slice(0,120);
  }
  updateShop(){
    const p=this.player;
    if(this.input.pressed('b')){saveGame(this.player);this.state='world';return;}
    if(this.input.pressed('left')||this.input.pressed('right')){this.shopTab=(this.shopTab+1)%2;this.shopIndex=0;return;}
    if(this.shopTab===0){
      const list=this.shopStock();
      if(this.input.pressed('up'))this.shopIndex=(this.shopIndex+list.length-1)%list.length;
      if(this.input.pressed('down'))this.shopIndex=(this.shopIndex+1)%list.length;
      if(this.input.pressed('a')){
        const id=list[this.shopIndex],db=ITEM_DB[id];if(!db)return;
        const discount=this.player._secondBonus('shopDiscount');
        const price=Math.floor(db.price*SHOP_MULT*discount);
        if(p.currency<price){this.showToast('Uang kurang!');return;}
        p.currency-=price;p.addItem(id,1);this.showToast(`Beli ${db.name} -${fmtCurrency(price)}`);saveGame(this.player);
      }
    }else{
      const inv=p.sortedInventory('name');
      if(inv.length===0)return;
      this.shopIndex=clamp(this.shopIndex,0,inv.length-1);
      if(this.input.pressed('up'))this.shopIndex=(this.shopIndex+inv.length-1)%inv.length;
      if(this.input.pressed('down'))this.shopIndex=(this.shopIndex+1)%inv.length;
      if(this.input.pressed('a')){
        const it=inv[this.shopIndex];if(!it)return;
        const db=ITEM_DB[it.id];if(!db)return;
        p.removeItem(it.id,1);const gain=db.sell*SELL_MULT;p.currency+=gain;
        this.showToast(`Jual ${db.name} +${fmtCurrency(gain)}`);
        const ni=p.sortedInventory('name');this.shopIndex=clamp(this.shopIndex,0,Math.max(0,ni.length-1));
        saveGame(this.player);
      }
    }
  }

      c.fillText(tabs[i],tx+tw/2-1,by+52);
    }
    c.textAlign='left';
    const y0=by+72,rowH=32;
    if(this.shopTab===0){
      const list=this.shopStock();
      if(list.length===0){c.fillStyle='#888';c.font='12px system-ui';c.textAlign='center';c.fillText('Tidak ada item',VIEW_W/2,y0+40);c.textAlign='left';}
      else{
        const maxRows=Math.floor((by+bh-y0-20)/rowH);
        let startIdx=clamp(this.shopIndex-Math.floor(maxRows/2),0,Math.max(0,list.length-maxRows));
        for(let i=0;i<list.length;i++){
          const dispIdx=i-startIdx;if(dispIdx<0||dispIdx>=maxRows)continue;
          const id=list[i],db=ITEM_DB[id];
          const price=Math.floor(db.price*SHOP_MULT*this.player._secondBonus('shopDiscount'));
          const canAfford=this.player.currency>=price;
          const ry=y0+dispIdx*rowH;const sel=i===this.shopIndex;
          if(sel){
            const sg=c.createLinearGradient(bx+14,ry-12,bx+bw-14,ry+18);
            sg.addColorStop(0,'rgba(201,160,74,0.5)');sg.addColorStop(1,'rgba(160,120,40,0.3)');
            c.fillStyle=sg;c.beginPath();c.roundRect(bx+14,ry-12,bw-28,28,6);c.fill();
            c.strokeStyle='#ffe27a';c.lineWidth=1.5;c.stroke();
          }
          c.fillStyle=db.color||'#888';c.beginPath();c.roundRect(bx+18,ry-5,6,14,2);c.fill();
          c.textAlign='left';c.font='bold 12px system-ui';c.fillStyle=sel?'#ffe27a':'#fff';
          const mismatch=db.slot==='weapon'&&db.wtype&&db.wtype!==this.player.classData.weaponType;
          c.fillText((mismatch?'🔒 ':'')+db.name,bx+30,ry);
          c.fillStyle=mismatch?'#a55':'#aab';c.font='9px system-ui';
          c.fillText(mismatch?`${db.desc} · ${WTYPE_LABEL[db.wtype]}`:db.desc,bx+30,ry+12);
          c.textAlign='right';c.fillStyle=canAfford?'#ffd700':'#e55';c.font='bold 11px system-ui';
          c.fillText(fmtCurrency(price),bx+bw-18,ry);c.textAlign='left';
        }
      }
    }else{
      const inv=this.player.sortedInventory('name');
      if(inv.length===0){c.fillStyle='#888';c.font='12px system-ui';c.textAlign='center';c.fillText('Inventory kosong',VIEW_W/2,y0+30);c.textAlign='left';}
      else{
        const maxRows=Math.floor((by+bh-y0-20)/rowH);
        let startIdx=clamp(this.shopIndex-Math.floor(maxRows/2),0,Math.max(0,inv.length-maxRows));
        for(let i=0;i<inv.length;i++){
          const it=inv[i],db=ITEM_DB[it.id];if(!db)continue;
          const dispIdx=i-startIdx;if(dispIdx<0||dispIdx>=maxRows)continue;
          const ry=y0+dispIdx*rowH;const sel=i===this.shopIndex;
          if(sel){
            const sg=c.createLinearGradient(bx+14,ry-12,bx+bw-14,ry+18);
            sg.addColorStop(0,'rgba(201,160,74,0.5)');sg.addColorStop(1,'rgba(160,120,40,0.3)');
            c.fillStyle=sg;c.beginPath();c.roundRect(bx+14,ry-12,bw-28,28,6);c.fill();
            c.strokeStyle='#ffe27a';c.lineWidth=1.5;c.stroke();
          }
          c.fillStyle=db.color||'#888';c.beginPath();c.roundRect(bx+18,ry-5,6,14,2);c.fill();
          c.textAlign='left';c.font='bold 12px system-ui';c.fillStyle=sel?'#ffe27a':'#fff';
          c.fillText(`${db.name} x${it.count}`,bx+30,ry);
          c.textAlign='right';c.fillStyle='#ffd700';c.font='bold 11px system-ui';
          c.fillText(fmtCurrency(db.sell*SELL_MULT),bx+bw-18,ry);c.textAlign='left';
        }
      }
    }
    c.fillStyle='#888';c.font='10px system-ui';c.textAlign='center';
    c.fillText('◀▶tab · ▲▼pilih · A beli/jual · B tutup',VIEW_W/2,by+bh-8);c.textAlign='left';
  }
  renderVictory(){
    const c=this.ctx;
    const g=c.createLinearGradient(0,0,0,VIEW_H);
    g.addColorStop(0,'#3a2a0a');g.addColorStop(1,'#000');
    c.fillStyle=g;c.fillRect(0,0,VIEW_W,VIEW_H);
    for(let i=0;i<80;i++){
      const x=(i*137)%VIEW_W,y=(i*71)%VIEW_H;
      const tw=Math.sin(performance.now()/400+i)*0.5+0.5;
      c.fillStyle=`rgba(255,215,100,${0.4+tw*0.5})`;
      c.fillRect(x,y,1,1);
    }
    c.fillStyle='#ffe27a';c.font='bold 26px system-ui';c.textAlign='center';
    c.shadowColor='#ffd700';c.shadowBlur=20;
    c.fillText('★ VICTORY ★',VIEW_W/2,VIEW_H/2-50);
    c.shadowBlur=0;
    c.fillStyle='#fff';c.font='14px system-ui';
    c.fillText('Kamu mengalahkan Worldheart!',VIEW_W/2,VIEW_H/2-15);
    c.fillText('Kau telah menyelesaikan takdir dunia.',VIEW_W/2,VIEW_H/2+10);
    if((performance.now()/600|0)%2===0){c.fillStyle='#ffe27a';c.font='bold 13px system-ui';c.fillText('▶ Tekan A untuk lanjut',VIEW_W/2,VIEW_H/2+80);}
    c.textAlign='left';
  }
  showAuth(){this.state='idle';this.player=null;this.battle=null;authUI.init();}
  showToast(text,dur=2.0){this.toast=text;this.toastTimer=dur;}
  renderToast(){
    const c=this.ctx;const alpha=Math.min(1,this.toastTimer*2);
    c.save();c.globalAlpha=alpha;c.font='bold 12px system-ui';
    const tw=c.measureText(this.toast).width+36;
    const tx=(VIEW_W-tw)/2,ty=100;
    const grd=c.createLinearGradient(tx,ty,tx,ty+32);
    grd.addColorStop(0,'rgba(30,25,50,0.98)');grd.addColorStop(1,'rgba(15,10,30,0.98)');
    c.fillStyle=grd;c.beginPath();c.roundRect(tx,ty,tw,32,10);c.fill();
    c.strokeStyle='#ffe27a';c.lineWidth=2;c.stroke();
    c.strokeStyle='rgba(255,255,255,0.2)';c.lineWidth=1;
    c.beginPath();c.roundRect(tx+2,ty+2,tw-4,14,8);c.stroke();
    c.fillStyle='#ffe27a';c.textAlign='center';c.textBaseline='middle';
    c.fillText(this.toast,VIEW_W/2,ty+17);
    c.textBaseline='alphabetic';c.textAlign='left';c.restore();
  }
}
function MONSTER_DROP_POOL(level){
  const pool=[];
  for(const id in ITEM_DB){
    const db=ITEM_DB[id];if(!db||!db.slot)continue;
    if(!db.level)continue;
    if(Math.abs(db.level-level)>10)continue;
    if(db.rarity==='legend'&&chance(0.85))continue;
    if(db.rarity==='epic'&&chance(0.7))continue;
    pool.push(id);
  }
  return pool;
}

const authOverlay=document.getElementById('authOverlay');
const authCard=document.getElementById('authCard');

const authUI={
  init(){authOverlay.style.display='flex';this.renderLogin();},
  hide(){authOverlay.style.display='none';},
  renderLogin(){
    const saves=listSaves();
    let sl='';
    if(saves.length>0){
      sl='<div class="saves"><div style="font-size:10px;color:#9aa;margin-bottom:6px;font-weight:bold;letter-spacing:1px;">💾 SAVE TERAKHIR:</div>';
      for(const s of saves.slice(0,5)){
        const loc=LOC_MAP[s.currentLocation]||LOC_MAP[HOME_CITY];
        const cls=CLASS_DB[s.classId]||CLASS_DB.archer;
        const r=RACES[s.raceId]||RACES.human;
        sl+=`<div class="save" data-user="${s.username}">
          <b style="color:#ffe27a">${s.nickname||s.charName}</b>
          <span style="color:#888">(${s.username})</span>
          <span style="float:right;color:#4ac">Lv${s.level}·${r.icon}${cls.emoji}</span>
          <div style="color:#888;font-size:9px;margin-top:3px;">${loc.icon} ${loc.name}</div>
        </div>`;
      }
      sl+='</div>';
    }
    authCard.innerHTML=`
      <h1>⚔️ MINI RPG</h1>
      <div class="sub">ISEKAI ADVENTURE · v8.2</div>
      <div class="mini-label">Username</div>
      <input id="usernameInput" placeholder="3-16 karakter" maxlength="16" autocomplete="off" />
      <button class="primary" id="loginBtn">🔑 LOGIN</button>
      <button class="primary register" id="registerBtn">📝 REGISTER</button>
      <div class="err" id="authErr"></div>
      ${sl}
    `;
    document.getElementById('loginBtn').onclick=()=>this.doLogin();
    document.getElementById('registerBtn').onclick=()=>this.doRegister();
    document.getElementById('usernameInput').addEventListener('keydown',e=>{if(e.key==='Enter')this.doLogin();});
    authCard.querySelectorAll('.save').forEach(el=>{
      el.onclick=()=>{const user=el.dataset.user;try{const data=JSON.parse(localStorage.getItem(SAVE_KEY(user)));if(data)this.loadAndStart(data);}catch(e){}};
    });
  },
  _validateUsername(){
    const val=document.getElementById('usernameInput').value.trim();
    const err=document.getElementById('authErr');
    if(val.length<3){err.textContent='Username minimal 3 karakter';return null;}
    if(!/^[a-zA-Z0-9_]+$/.test(val)){err.textContent='Hanya huruf, angka, _';return null;}
    return val;
  },
  doLogin(){
    const err=document.getElementById('authErr');err.textContent='';
    const val=this._validateUsername();if(!val)return;
    const existing=localStorage.getItem(SAVE_KEY(val));
    if(!existing){err.textContent='❌ Username tidak ditemukan. Register dulu!';return;}
    try{const data=JSON.parse(existing);this.renderContinue(data);}
    catch(e){err.textContent='Save rusak';}
  },
  doRegister(){
    const err=document.getElementById('authErr');err.textContent='';
    const val=this._validateUsername();if(!val)return;
    const existing=localStorage.getItem(SAVE_KEY(val));
    if(existing){err.textContent='❌ Username sudah dipakai. Login!';return;}
    this.renderCreate(val);
  },
  renderContinue(saved){
    const loc=LOC_MAP[saved.currentLocation]||LOC_MAP[HOME_CITY];
    const cls=CLASS_DB[saved.classId]||CLASS_DB.archer;
    const r=RACES[saved.raceId]||RACES.human;
    const wallet=saved.currency||0;
    const bank=saved.bank||0;
    authCard.innerHTML=`
      <h2>⚔️ Selamat Datang Kembali</h2>
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:20px;font-weight:bold;color:#ffe27a;margin-bottom:4px;text-shadow:0 0 15px rgba(255,226,122,0.5);">${saved.nickname||saved.charName}</div>
        <div style="color:#aab;font-size:12px;">${r.icon} ${r.name} · ${cls.emoji} ${cls.name} · Lv.${saved.level}</div>
        <div style="color:#7ac;font-size:11px;margin-top:6px;">${loc.icon} ${loc.name}</div>
        <div style="color:#aab;font-size:10px;margin-top:6px;">⚔${saved.kills||0} · 🏰F${saved.dungeonBest||0} · 🗼F${saved.towerBest||0} · 💀${saved.deaths||0}</div>
        <div style="color:#ffd700;font-size:11px;margin-top:8px;">👛 ${fmtCurrency(wallet)} · 🏦 ${fmtCurrency(bank)}</div>
      </div>
      <button class="primary" id="contBtn">▶ LANJUTKAN</button>
      <button class="secondary" id="backBtn">← Ganti Akun</button>
    `;
    document.getElementById('contBtn').onclick=()=>this.loadAndStart(saved);
    document.getElementById('backBtn').onclick=()=>this.renderLogin();
  },
  renderCreate(username){
    const raceOpts=Object.values(RACES).map(r=>`
      <div class="opt-item" data-race="${r.id}">
        <div class="nm">${r.icon} ${r.name}</div>
        <div class="ds">${r.desc}</div>
      </div>`).join('');
    const baseOpts=BASE_CLASSES.map(c=>`
      <div class="opt-item" data-class="${c.id}">
        <div class="nm">${c.emoji} ${c.name} <span style="color:#7ac;font-weight:normal;">${WTYPE_LABEL[c.weaponType]}</span></div>
        <div class="st">STR${c.stats.str} VIT${c.stats.vit} AGI${c.stats.agi} INT${c.stats.int} WIS${c.stats.wis}</div>
      </div>`).join('');
    authCard.innerHTML=`
      <h2>✨ Buat Karakter</h2>
      <div style="font-size:11px;color:#4ac;text-align:center;margin-bottom:4px;">Username: <b style="color:#ffe27a">${username}</b></div>
      <div style="font-size:10px;color:#e88;text-align:center;margin-bottom:10px;">⚠️ Pilihan Race & Class PERMANEN</div>
      <div class="mini-label">Nama Karakter</div>
      <input id="charNameInput" placeholder="2-12 karakter" maxlength="12" autocomplete="off" />
      <div class="mini-label">Nickname (opsional)</div>
      <input id="nicknameInput" placeholder="Kosongkan = pakai nama" maxlength="16" autocomplete="off" />
      <div class="mini-label">Race (permanen)</div>
      <div class="opt-list" id="raceList">${raceOpts}</div>
      <div class="mini-label">Base Class (bisa evolusi)</div>
      <div class="opt-list" id="classList">${baseOpts}</div>
      <button class="primary register" id="createBtn">✨ MULAI PETUALANGAN</button>
      <button class="secondary" id="backBtn">← Kembali</button>
      <div class="err" id="createErr"></div>
    `;
    let selectedRace='human',selectedClass='archer';
    const raceList=document.getElementById('raceList');
    const classList=document.getElementById('classList');
    const setRace=id=>{selectedRace=id;raceList.querySelectorAll('.opt-item').forEach(el=>el.classList.toggle('selected',el.dataset.race===id));};
    const setClass=id=>{selectedClass=id;classList.querySelectorAll('.opt-item').forEach(el=>el.classList.toggle('selected',el.dataset.class===id));};
    raceList.querySelectorAll('.opt-item').forEach(el=>{el.onclick=()=>setRace(el.dataset.race);});
    classList.querySelectorAll('.opt-item').forEach(el=>{el.onclick=()=>setClass(el.dataset.class);});
    setRace('human');setClass('archer');
    document.getElementById('backBtn').onclick=()=>this.renderLogin();
    document.getElementById('createBtn').onclick=()=>{
      const name=document.getElementById('charNameInput').value.trim();
      const nick=document.getElementById('nicknameInput').value.trim();
      const err=document.getElementById('createErr');
      if(name.length<2){err.textContent='Nama minimal 2 karakter';return;}
      if(!/^[a-zA-Z0-9 ]+$/.test(name)){err.textContent='Hanya huruf, angka, spasi';return;}
      const cl=CLASS_DB[selectedClass];
      const starterWeapon=STARTER_WEAPON[cl.weaponType]||'wood_sword';
      const p=new Player({
        username,charName:name,nickname:nick||name,
        classId:selectedClass,raceId:selectedRace,
        level:1,exp:0,expNext:25,statPoints:0,skillPoints:0,
        stats:{...cl.stats},
        equipment:{weapon:null,head:null,body:null,gloves:null,boots:null,accessory:null,cape:null},
        currency:toBronze(200,50,50),bank:0,
        inventory:[{id:'potion',count:5},{id:starterWeapon,count:1},{id:'leather_armor',count:1}],
        skills:{},currentLocation:HOME_CITY,homeCity:HOME_CITY,visitedLocations:[HOME_CITY],
        tx:11,ty:11,
      });
      p.equip(starterWeapon);p.equip('leather_armor');
      p.hp=p.maxHp;p.mp=p.maxMp;
      saveGame(p);
      try{this.loadAndStart(JSON.parse(localStorage.getItem(SAVE_KEY(username))));}catch(e){this.loadAndStart(p);}
    };
    document.getElementById('charNameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('createBtn').click();});
  },
  loadAndStart(saved){
    this.hide();
    const p=new Player(saved);
    game.setPlayer(p);
    game.showToast(`Selamat datang, ${p.nickname||p.name}!`,2.5);
  },
};

const game=new Game();
window.game=game;
authUI.init();
console.log(`Loaded ${MONSTER_LIST.length} monsters, ${Object.keys(ITEM_DB).length} items`);
</script>
