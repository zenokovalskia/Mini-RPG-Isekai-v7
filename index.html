<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mini RPG — Isekai v7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;background:#1a1a2e;border-radius:4px}
#dpad{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;z-index:10;touch-action:none}
#dpad button{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.30);color:#fff;font-size:16px;border-radius:12px;cursor:pointer;transition:transform .06s,background .06s;touch-action:none}
#dpad button:active{background:rgba(255,255,255,.42);transform:scale(.94)}
#dpad button[data-dir="up"]{grid-area:1/2}#dpad button[data-dir="left"]{grid-area:2/1}#dpad button[data-dir="right"]{grid-area:2/3}#dpad button[data-dir="down"]{grid-area:3/2}
#actions{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));display:flex;gap:10px;z-index:10;touch-action:none;align-items:flex-end}
#actions button{width:58px;height:58px;border-radius:50%;background:rgba(255,90,90,.28);border:2px solid rgba(255,140,140,.65);color:#fff;font-size:18px;font-weight:bold;cursor:pointer;transition:transform .06s,background .06s;touch-action:none;display:flex;align-items:center;justify-content:center}
#actions button[data-action="b"]{background:rgba(90,150,255,.28);border-color:rgba(140,180,255,.65)}
#actions button[data-action="m"]{background:rgba(255,226,122,.28);border-color:rgba(255,226,122,.7);font-size:20px}
#actions button[data-action="s"]{background:rgba(140,240,140,.28);border-color:rgba(140,240,140,.7);font-size:18px}
#actions button[data-action="auto"]{background:rgba(200,120,255,.28);border-color:rgba(200,120,255,.7);font-size:20px}
#actions button[data-action="auto"].active{background:rgba(200,120,255,.75);border-color:#fff;box-shadow:0 0 20px rgba(200,120,255,.9)}
#actions button:active{background:rgba(255,255,255,.5);transform:scale(.94)}
@media (max-width: 480px){
  #dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:3px}
  #dpad button{font-size:14px;border-radius:10px}
  #actions{flex-direction:column;gap:8px}
  #actions button{width:50px;height:50px;font-size:16px}
  #actions button[data-action="m"],#actions button[data-action="auto"]{font-size:18px}
  #actions button[data-action="s"]{font-size:16px}
}
@media (max-width: 360px){
  #dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  #actions button{width:46px;height:46px;font-size:14px}
}
#authOverlay{position:fixed;inset:0;background:linear-gradient(180deg,#0a0a1a,#1a1030);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;overflow-y:auto}
.auth-card{background:rgba(20,20,40,.97);border:2px solid #4a6ac9;border-radius:14px;padding:22px 18px;width:100%;max-width:420px;color:#fff;box-shadow:0 0 60px rgba(74,106,201,.35);margin:auto}
.auth-card h1{font-size:22px;text-align:center;margin-bottom:4px;color:#ffe27a;letter-spacing:2px}
.auth-card .sub{text-align:center;color:#aab;font-size:11px;margin-bottom:16px}
.auth-card h2{font-size:16px;text-align:center;color:#ffe27a;margin-bottom:12px}
.auth-card input{width:100%;padding:11px 13px;font-size:14px;background:#0e0e22;border:2px solid #444;border-radius:8px;color:#fff;margin-bottom:10px;outline:none;font-family:inherit}
.auth-card input:focus{border-color:#4a6ac9}
.auth-card .mini-label{font-size:10px;color:#aab;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.auth-card button.primary{width:100%;padding:12px;font-size:14px;font-weight:bold;background:linear-gradient(180deg,#4a6ac9,#3550a5);color:#fff;border:none;border-radius:8px;cursor:pointer;margin-top:6px;transition:transform .06s}
.auth-card button.primary:active{transform:scale(.98)}
.auth-card button.register{background:linear-gradient(180deg,#4ac96a,#2a8a4a)}
.auth-card button.secondary{width:100%;padding:9px;font-size:12px;background:transparent;color:#aab;border:1px solid #555;border-radius:8px;cursor:pointer;margin-top:8px}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:170px;overflow-y:auto;padding-right:4px}
.opt-item{padding:9px 11px;border:2px solid #444;border-radius:7px;background:#0e0e22;cursor:pointer;font-size:12px}
.opt-item.selected{border-color:#ffe27a;background:rgba(255,226,122,.10)}
.opt-item .nm{font-weight:bold;font-size:13px;margin-bottom:2px}
.opt-item .ds{font-size:10px;color:#aab}
.opt-item .st{font-size:9px;color:#7aa;margin-top:3px;font-family:monospace}
.err{color:#e55;font-size:11px;margin-top:6px;text-align:center;min-height:14px}
.saves{margin-top:10px}
.saves .save{padding:9px;background:#0e0e22;border:1px solid #444;border-radius:6px;margin-bottom:5px;cursor:pointer;font-size:11px}
.saves .save:hover{border-color:#4a6ac9}
@media (pointer:fine){#dpad,#actions{opacity:.6}#dpad:hover,#actions:hover{opacity:1}}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>
<div id="dpad">
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="right">▶</button>
  <button data-dir="down">▼</button>
</div>
<div id="actions">
  <button data-action="s" title="Status">📊</button>
  <button data-action="m" title="Peta">🗺️</button>
  <button data-action="auto" title="Auto Battle">⚡</button>
  <button data-action="b" title="Menu/Batal">B</button>
  <button data-action="a" title="Aksi">A</button>
</div>
<div id="authOverlay"><div class="auth-card" id="authCard"></div></div>

<script type="module">
/* =========================================================
   CORE
   ========================================================= */
const TILE=32,VIEW_TX=15,VIEW_TY=15;
const VIEW_W=TILE*VIEW_TX,VIEW_H=TILE*VIEW_TY;
const MOVE_MS=150;
const T={GRASS:0,GRASS_DARK:1,PATH:2,WALL:3,WATER:4,TREE:5,FLOWER:6,SAND:7,LAVA:8,ROCK:9,CRYSTAL:10,ASH:11,SNOW:12,ORE:13,ORE_RARE:14};
const SOLID=new Set([T.WALL,T.TREE,T.ROCK,T.LAVA,T.WATER,T.ORE,T.ORE_RARE]);
const GATHERABLE=new Set([T.TREE,T.ROCK,T.ORE,T.ORE_RARE,T.FLOWER]);
const STAT_KEYS=['str','vit','agi','int','wis'];
const STAT_LABELS={str:'STR',vit:'VIT',agi:'AGI',int:'INT',wis:'WIS'};
const STAT_DESC={str:'ATK +2.5/pt',vit:'HP +8/pt',agi:'SPD +1.2/pt',int:'MATK +2.5/pt',wis:'MP+DEF+Misc'};
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>n>=1e12?(n/1e12).toFixed(1)+'T':n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.floor(n));

/* CURRENCY */
const CURRENCY_TIERS=[
  {v:1000000000000, icon:'💎', name:'Divine'},
  {v:100000,        icon:'🔮', name:'Adamantite'},
  {v:10000,         icon:'💠', name:'Mithril'},
  {v:1000,          icon:'⬜', name:'Platinum'},
  {v:100,           icon:'🟡', name:'Gold'},
  {v:10,            icon:'⚪', name:'Silver'},
  {v:1,             icon:'🟤', name:'Bronze'},
];
const toBronze=(g,s,b)=>(g||0)*100+(s||0)*10+(b||0);
function fmtCurrency(bronze){
  bronze=Math.max(0,Math.floor(bronze||0));
  if(bronze===0)return '0🟤';
  const out=[];let rem=bronze;
  for(const t of CURRENCY_TIERS){
    const n=Math.floor(rem/t.v);
    if(n>0){out.push(`${n}${t.icon}`);rem-=n*t.v;}
    if(out.length>=3)break;
  }
  return out.join(' ');
}
const SHOP_MULT=1;
const SELL_MULT=1;
const KILL_MULT=1;

/* MONSTERS */
const MONSTER_BASES=[
  {name:'Slime',shape:'slime',color:'#5bc95b',element:'nature',baseLevel:1},
  {name:'Rat',shape:'beast',color:'#8a6a4a',element:'nature',baseLevel:2},
  {name:'Bat',shape:'bat',color:'#6a4a8a',element:'dark',baseLevel:3},
  {name:'Bee',shape:'bat',color:'#ffcc33',element:'wind',baseLevel:4},
  {name:'Wolf',shape:'beast',color:'#8a8a8a',element:'nature',baseLevel:6},
  {name:'Goblin',shape:'orc',color:'#6a8a3a',element:'nature',baseLevel:9},
  {name:'Ghost',shape:'ghost',color:'#cccccc',element:'dark',baseLevel:13},
  {name:'Skeleton',shape:'ghost',color:'#e8e8d8',element:'dark',baseLevel:17},
  {name:'Orc',shape:'orc',color:'#8a5a3a',element:'nature',baseLevel:22},
  {name:'Golem',shape:'orc',color:'#7a7a6a',element:'earth',baseLevel:30},
  {name:'Wraith',shape:'ghost',color:'#9a9adc',element:'dark',baseLevel:40},
  {name:'Imp',shape:'demon',color:'#e85a2a',element:'fire',baseLevel:50},
  {name:'Demon',shape:'demon',color:'#c91a1a',element:'fire',baseLevel:65},
  {name:'Elemental',shape:'ghost',color:'#5ac9ff',element:'arcane',baseLevel:85},
  {name:'Wyvern',shape:'bat',color:'#8a5aa8',element:'wind',baseLevel:110},
  {name:'Dragon',shape:'dragon',color:'#c91a1a',element:'fire',baseLevel:150},
  {name:'Celestial',shape:'ghost',color:'#ffe27a',element:'holy',baseLevel:200},
  {name:'Voidling',shape:'demon',color:'#4a1a6a',element:'void',baseLevel:270},
  {name:'Lich',shape:'ghost',color:'#6affaa',element:'dark',baseLevel:340},
  {name:'Nightmare',shape:'demon',color:'#1a1a1a',element:'dark',baseLevel:420},
  {name:'Behemoth',shape:'orc',color:'#5a3a2a',element:'earth',baseLevel:520},
  {name:'Timekeeper',shape:'ghost',color:'#c9a0ff',element:'arcane',baseLevel:620},
  {name:'Titan',shape:'orc',color:'#a8a8c9',element:'earth',baseLevel:720},
  {name:'Seraph',shape:'ghost',color:'#ffffff',element:'holy',baseLevel:820},
  {name:'Abyssal',shape:'demon',color:'#1a0a3a',element:'void',baseLevel:920},
];
const MONSTER_PREFIX=['','Lesser ','Greater ','Elder ','Ancient ','Feral ','Cursed ','Blessed ','Shadow ','Crystal ','Flame ','Frost ','Storm ','Void ','Radiant ','Dark ','Savage ','Divine ','Tainted ','Primal ','Ethereal ','Cosmic ','Eternal ','Fallen ','Sacred ','Abyssal ','Infernal ','Frozen ','Blazing ','Thunder ','Obsidian ','Mythril ','Adamant ','Chaos ','Order ','Dream ','Dread ','Glacial ','Molten ','Voidtouched '];
const ELEMENT_RESIST={nature:[],dark:['poison'],fire:['fire'],ice:['ice'],holy:['holy'],arcane:['fire','ice'],void:['poison','physical'],earth:['physical'],wind:[],poison:['poison'],physical:['physical']};
const ELEMENT_WEAK={nature:['fire'],dark:['holy'],fire:['ice'],ice:['fire'],holy:['poison'],arcane:['physical'],void:['holy'],earth:['ice'],wind:['earth'],poison:['holy'],physical:['arcane']};
const MONSTER_TEMPLATES={};const MONSTER_LIST=[];let _mid=0;
for(let tier=0;tier<40;tier++){
  for(const base of MONSTER_BASES){
    if(_mid>=1000)break;
    const prefix=MONSTER_PREFIX[tier%MONSTER_PREFIX.length];
    const level=Math.max(1,Math.floor(base.baseLevel*Math.pow(1.19,tier*0.55))+tier*3);
    const id=(tier===0?base.name.toLowerCase():base.name.toLowerCase()+'_t'+tier);
    const isBoss=(tier>=35&&Math.random()<0.03);
    const hp=Math.floor(14*Math.pow(level,1.18)*(1+tier*0.22));
    const atk=Math.floor(3*Math.pow(level,1.02)*(1+tier*0.18));
    const def=Math.floor(1+level*0.9*(1+tier*0.20));
    const exp=Math.floor(6*Math.pow(level,1.32)*(1+tier*0.35));
    const gold=Math.floor(3*Math.pow(level,1.22)*(1+tier*0.30));
    MONSTER_TEMPLATES[id]={id,name:prefix+base.name,shape:base.shape,color:base.color,level,hp,atk,def,exp,gold,boss:isBoss,element:base.element,resist:ELEMENT_RESIST[base.element]||[],weak:ELEMENT_WEAK[base.element]||[],regen:isBoss?0.02:(tier>=20?0.01:0),enrage:isBoss||tier>=25,drops:[]};
    MONSTER_LIST.push(id);_mid++;
  }
  if(_mid>=1000)break;
}
while(_mid<1000){
  const base=MONSTER_BASES[_mid%MONSTER_BASES.length];const level=1000+_mid;const id=base.name.toLowerCase()+'_x'+_mid;
  MONSTER_TEMPLATES[id]={id,name:'Ancient '+base.name+' +'+_mid,shape:base.shape,color:base.color,level,hp:Math.floor(14*Math.pow(level,1.18)),atk:Math.floor(3*Math.pow(level,1.02)),def:Math.floor(level*0.9),exp:Math.floor(6*Math.pow(level,1.32)),gold:Math.floor(3*Math.pow(level,1.22)),boss:false,element:base.element,resist:ELEMENT_RESIST[base.element]||[],weak:ELEMENT_WEAK[base.element]||[],regen:0,enrage:false,drops:[]};
  MONSTER_LIST.push(id);_mid++;
}

/* ITEMS */
const ITEM_DB={};let _iid=0;
const RARITY=[
  {id:'common',name:'',color:'#aaa',mult:1.00,price:1,icon:'•'},
  {id:'uncommon',name:'Fine ',color:'#6c6',mult:1.25,price:3,icon:'✦'},
  {id:'rare',name:'Superior ',color:'#5af',mult:1.55,price:9,icon:'✦✦'},
  {id:'epic',name:'Master ',color:'#c6f',mult:1.95,price:25,icon:'✦✦✦'},
  {id:'legend',name:'Legendary ',color:'#fc6',mult:2.50,price:70,icon:'★'},
];
const MAT_TIERS=['Copper','Bronze','Iron','Steel','Silver','Gold','Platinum','Mythril','Adamant','Orichalcum','Dragonbone','Voidstone','Celestial','Aether','Starmetal'];
const WEAPON_TYPES=['sword','staff','dagger','bow','spear','fist','gun'];
const WEAPON_SUFFIX={sword:['Blade','Saber','Falchion','Longsword','Edge'],staff:['Staff','Rod','Cane','Wand','Scepter'],dagger:['Dagger','Kris','Stiletto','Shiv','Fang'],bow:['Bow','Longbow','Recurve','Shortbow','Windpiercer'],spear:['Spear','Lance','Pike','Halberd','Glaive'],fist:['Knuckles','Claws','Fists','Gauntlets','Wraps'],gun:['Pistol','Revolver','Rifle','Carbine','Cannon']};
const ARMOR_SLOTS=['head','body','gloves','boots','accessory','cape'];
const ARMOR_SUFFIX={head:['Cap','Helm','Hood','Crown','Circlet'],body:['Vest','Mail','Armor','Robe','Plate'],gloves:['Gloves','Gauntlets','Bracers','Mitts','Handwraps'],boots:['Boots','Greaves','Sandals','Striders','Treads'],accessory:['Ring','Amulet','Pendant','Talisman','Charm'],cape:['Cloak','Cape','Mantle','Shroud','Drape']};
function registerItem(id,data){if(!ITEM_DB[id]){ITEM_DB[id]=Object.assign({id},data);_iid++;}}
const BASE_ITEMS=[['potion','Potion',30,15,'heal',20,'+20 HP','#e55'],['ether','Ether',70,35,'heal',45,'+45 HP','#e55'],['elixir','Elixir',220,110,'fullheal',0,'Full HP','#f7a'],['mana_potion','Mana Potion',40,20,'mana',25,'+25 MP','#4ac'],['hi_mana','Hi-Mana',120,60,'mana',80,'+80 MP','#4ac'],['bomb','Bomb',55,27,'damage',25,'25 DMG','#fa4'],['big_bomb','Big Bomb',180,90,'damage',90,'90 DMG','#fa4']];
for(const [id,nm,p,s,t,v,d,cl] of BASE_ITEMS)registerItem(id,{name:nm,price:p,sell:s,type:t,value:v,desc:d,color:cl});
const POTION_PREFIX=['Minor','Lesser','Standard','Greater','Superior','Grand','Supreme','Divine','Mythic','Eternal'];
const POTION_KINDS=[{k:'heal',nm:'Healing Potion',type:'heal',col:'#e55',stat:'hp'},{k:'mana',nm:'Mana Potion',type:'mana',col:'#4ac',stat:'mp'},{k:'full',nm:'Elixir',type:'fullheal',col:'#f7a',stat:'full'},{k:'bomb',nm:'Bomb',type:'damage',col:'#fa4',stat:'dmg'},{k:'antidote',nm:'Antidote',type:'cure',col:'#7c4',stat:'cure'}];
for(let tier=0;tier<10;tier++)for(const k of POTION_KINDS){
  const val=Math.floor(20*Math.pow(1.55,tier));const price=Math.floor(30*Math.pow(1.9,tier));
  registerItem(`${k.k}_${tier}`,{name:`${POTION_PREFIX[tier]} ${k.nm}`,price,sell:Math.floor(price/2),type:k.type,value:val,desc:k.type==='fullheal'?'Full restore':`+${fmt(val)} ${k.stat.toUpperCase()}`,color:k.col});
}
for(let i=0;i<250;i++){
  const id='potion_p_'+i;const tier=i%10;const k=POTION_KINDS[i%POTION_KINDS.length];
  registerItem(id,{name:`${POTION_PREFIX[tier]} ${k.nm} ${i}`,price:30+i*15,sell:15+i*7,type:k.type,value:20+tier*30,desc:`+${20+tier*30}`,color:k.col});
}
for(const wt of WEAPON_TYPES){
  for(let mt=0;mt<MAT_TIERS.length;mt++)for(let ri=0;ri<RARITY.length;ri++)for(let v=0;v<2;v++){
    if(_iid>=5000)break;
    const sfx=WEAPON_SUFFIX[wt][v],mat=MAT_TIERS[mt],rar=RARITY[ri];
    const id=`${wt}_${mt}_${ri}_${v}`;const lvl=mt*22+ri*5+v*2+1;
    const atkBase=Math.floor(Math.pow(1.35,mt)*(2+ri*2+v));
    const bonusStat=['str','agi','int','wis','vit'][(mt+ri+v)%5];
    const bonus={};bonus[bonusStat]=Math.floor(mt*0.7)+ri*2+v;
    let mainStat={};
    if(wt==='staff')mainStat={matk:Math.floor(atkBase*1.1),int:bonus.int||0};
    else if(wt==='bow'||wt==='gun')mainStat={patk:atkBase,acc:mt+ri*2};
    else if(wt==='dagger')mainStat={patk:atkBase,spd:mt+ri+v*2};
    else if(wt==='fist')mainStat={patk:atkBase,agi:mt+ri};
    else if(wt==='spear')mainStat={patk:atkBase,vit:mt+ri};
    else mainStat={patk:atkBase,str:mt+ri};
    const stats=Object.assign({},bonus,mainStat);
    const statArr=Object.entries(stats).map(([k,v])=>`${v>=0?'+':''}${v} ${k.toUpperCase()}`).join(' ');
    const price=Math.floor((20+mt*80)*rar.price*1.8);
    registerItem(id,{name:`${rar.name}${mat} ${sfx}`,price,sell:Math.floor(price/2),slot:'weapon',wtype:wt,stats,level:lvl,color:rar.color,desc:statArr,rarity:rar.id});
  }
}
for(const slot of ARMOR_SLOTS){
  for(let mt=0;mt<MAT_TIERS.length;mt++)for(let ri=0;ri<RARITY.length;ri++)for(let v=0;v<2;v++){
    if(_iid>=5000)break;
    const sfx=ARMOR_SUFFIX[slot][v],mat=MAT_TIERS[mt],rar=RARITY[ri];
    const id=`${slot}_${mt}_${ri}_${v}`;const lvl=mt*22+ri*5+v*2+1;
    const base=Math.floor(Math.pow(1.32,mt)*(1+ri*2+v));
    const stats={};
    if(slot==='head'){stats.pdef=base;stats.vit=Math.floor(mt*0.4)+ri;}
    else if(slot==='body'){stats.pdef=Math.floor(base*1.3);stats.vit=Math.floor(mt*0.6)+ri;}
    else if(slot==='gloves'){stats.pdef=Math.floor(base*0.6);stats.patk=Math.floor(mt*0.5)+ri;}
    else if(slot==='boots'){stats.pdef=Math.floor(base*0.5);stats.spd=Math.floor(mt*0.4)+ri+v;}
    else if(slot==='accessory'){const k=['str','agi','int','wis','vit'][(mt+ri+v)%5];stats[k]=Math.floor(mt*0.5)+ri*2+v;stats.pdef=Math.floor(base*0.3);}
    else{stats.pdef=Math.floor(base*0.4);stats.mdef=Math.floor(base*0.6);stats.eva=ri;}
    const statArr=Object.entries(stats).map(([k,v])=>`+${v} ${k.toUpperCase()}`).join(' ');
    const price=Math.floor((15+mt*60)*rar.price*1.7);
    registerItem(id,{name:`${rar.name}${mat} ${sfx}`,price,sell:Math.floor(price/2),slot,stats,level:lvl,color:rar.color,desc:statArr,rarity:rar.id});
  }
}
const ORE_NAMES=['Copper','Tin','Iron','Silver','Gold','Platinum','Mythril','Adamant','Orichalcum','Voidstone','Celestial','Aether','Starmetal','Dragonbone','Obsidian'];
const WOOD_NAMES=['Oak','Pine','Birch','Maple','Ebony','Yew','Mythril Wood','Elderwood','Ironwood','Worldtree'];
const HERB_NAMES=['Sunleaf','Moonflower','Emberroot','Frostbloom','Nightshade','Golden Thistle','Mandragora','Bloodrose','Starfall Herb','Voidgrass'];
const GEM_NAMES=['Ruby','Sapphire','Emerald','Diamond','Topaz','Amethyst','Opal','Pearl','Onyx','Jade'];

/* INPUT */
class Input{
  constructor(){
    this.kbd={};this.touch={};this.justPressed=new Set();
    window.addEventListener('keydown',e=>{const k=this._n(e.key);if(!this.kbd[k])this.justPressed.add(k);this.kbd[k]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
    window.addEventListener('keyup',e=>{this.kbd[this._n(e.key)]=false;});
    const bind=(btn,key)=>{
      const on=e=>{e.preventDefault();e.stopPropagation();if(!this.touch[key])this.justPressed.add(key);this.touch[key]=true;};
      const off=e=>{e.preventDefault();e.stopPropagation();this.touch[key]=false;};
      btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});
      btn.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
      btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
      btn.addEventListener('contextmenu',e=>e.preventDefault());
    };
    document.querySelectorAll('#dpad button').forEach(b=>bind(b,b.dataset.dir));
    document.querySelectorAll('#actions button').forEach(b=>bind(b,b.dataset.action));
  }
  _n(k){return({'ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right','w':'up','s':'down','a':'left','d':'right','W':'up','S':'down','A':'left','D':'right','z':'a','Z':'a','Enter':'a',' ':'a','x':'b','X':'b','Escape':'b','Backspace':'b','m':'m','M':'m','p':'s','P':'s','t':'auto','T':'auto'})[k]||k;}
  isDown(k){return!!(this.kbd[k]||this.touch[k]);}
  pressed(k){return this.justPressed.has(k);}
  endFrame(){this.justPressed.clear();}
}

/* SAVE */
const SAVE_KEY=u=>'minirpg_isekai2_'+u.toLowerCase();
function listSaves(){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('minirpg_isekai2_')){
      try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.username)out.push(d);}catch(e){}
    }
  }
  return out.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
}
function saveGame(p){
  try{
    localStorage.setItem(SAVE_KEY(p.username),JSON.stringify({
      username:p.username,charName:p.name,nickname:p.nickname,
      classId:p.classId,raceId:p.raceId,secondClassId:p.secondClassId,
      level:p.level,exp:p.exp,expNext:p.expNext,

      inventory:p.inventory.map(i=>({id:i.id,count:i.count})),
      skills:{...p.skills},
      currentLocation:p.currentLocation,homeCity:p.homeCity,
      visitedLocations:[...p.visitedLocations],

}

function drawHero(c,x,y,size,dir,walking,cls){
  const cx=x+size/2,sc=size/32,t=performance.now();
  const bob=walking?Math.sin(t/100)*1:0,leg=walking?Math.sin(t/80)*2.5:0,arm=walking?Math.sin(t/80)*2.5:0;
  c.fillStyle='rgba(0,0,0,0.30)';c.beginPath();c.ellipse(cx,y+size-3,size*.3,size*.1,0,0,Math.PI*2);c.fill();
  c.fillStyle='#2a3a5a';c.fillRect(cx-6*sc,y+size-10*sc+leg,4*sc,8*sc);c.fillRect(cx+2*sc,y+size-10*sc-leg,4*sc,8*sc);
  c.fillStyle=(cls&&cls.color)||'#4a6ac9';c.fillRect(cx-8*sc,y+size-21*sc+bob,16*sc,12*sc);
  c.fillStyle='#8a5a2a';c.fillRect(cx-8*sc,y+size-12*sc+bob,16*sc,2*sc);
  c.fillStyle='#f5c99b';c.fillRect(cx-11*sc,y+size-20*sc+bob+arm,3*sc,8*sc);c.fillRect(cx+8*sc,y+size-20*sc+bob-arm,3*sc,8*sc);
  c.beginPath();c.arc(cx,y+size-27*sc+bob,8*sc,0,Math.PI*2);c.fill();
  c.fillStyle='#3a2a1a';c.beginPath();c.arc(cx,y+size-28*sc+bob,8*sc,Math.PI,0);c.fill();c.fillRect(cx-8*sc,y+size-29*sc+bob,16*sc,3*sc);
  c.fillStyle='#000';const ey=y+size-27*sc+bob-1;
  if(dir==='down'){c.fillRect(cx-4*sc,ey,2*sc,2*sc);c.fillRect(cx+2*sc,ey,2*sc,2*sc);}
  else if(dir==='left')c.fillRect(cx-5*sc,ey,2*sc,2*sc);
  else if(dir==='right')c.fillRect(cx+3*sc,ey,2*sc,2*sc);
}
function drawMonster(c,shape,x,y,size,color){
  const cx=x+size/2,cy=y+size/2,s=size;
  c.fillStyle='rgba(0,0,0,0.30)';c.beginPath();c.ellipse(cx,y+size-3,s*.4,s*.11,0,0,Math.PI*2);c.fill();
  const col=color||'#5bc95b';
  if(shape==='slime'){c.fillStyle=col;c.beginPath();c.ellipse(cx,cy+s*.08,s*.42,s*.36,0,0,Math.PI*2);c.fill();c.fillStyle='rgba(255,255,255,0.35)';c.beginPath();c.ellipse(cx-s*.1,cy-s*.05,s*.14,s*.14,0,0,Math.PI*2);c.fill();c.fillStyle='#000';c.fillRect(cx-s*.16,cy-s*.02,s*.08,s*.1);c.fillRect(cx+s*.08,cy-s*.02,s*.08,s*.1);}
  else if(shape==='bat'){c.fillStyle=col;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx-s*.55,cy-s*.22);c.lineTo(cx-s*.32,cy+s*.18);c.closePath();c.fill();c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+s*.55,cy-s*.22);c.lineTo(cx+s*.32,cy+s*.18);c.closePath();c.fill();c.beginPath();c.arc(cx,cy,s*.24,0,Math.PI*2);c.fill();c.fillStyle='#f44';c.fillRect(cx-s*.13,cy-s*.06,s*.06,s*.06);c.fillRect(cx+s*.07,cy-s*.06,s*.06,s*.06);}
  else if(shape==='ghost'){c.fillStyle=col;c.beginPath();c.arc(cx,cy-s*.05,s*.34,Math.PI,0);c.lineTo(cx+s*.34,cy+s*.32);c.lineTo(cx+s*.18,cy+s*.22);c.lineTo(cx,cy+s*.32);c.lineTo(cx-s*.18,cy+s*.22);c.lineTo(cx-s*.34,cy+s*.32);c.closePath();c.fill();c.fillStyle='#333';c.fillRect(cx-s*.18,cy-s*.14,s*.08,s*.1);c.fillRect(cx+s*.1,cy-s*.14,s*.08,s*.1);}

/* PLAYER */
class Player{
  constructor(data){
    this.username=data.username;
    this.name=data.charName;
    this.nickname=data.nickname||data.charName;
    this.classId=CLASS_DB[data.classId]?data.classId:'archer';
    this.raceId=RACES[data.raceId]?data.raceId:'human';
    this.secondClassId=data.secondClassId||null;
    this.level=data.level||1;
    this.exp=data.exp||0;
    this.expNext=data.expNext||this.calcExpNext(1);
    this.secondLevel=data.secondLevel||1;
    this.secondExp=data.secondExp||0;
    this.statPoints=data.statPoints||0;
    this.skillPoints=data.skillPoints||0;
    this.stats={str:5,vit:5,agi:5,int:5,wis:5,...(data.stats||{})};
    this.equipment={weapon:null,head:null,body:null,gloves:null,boots:null,accessory:null,cape:null,...(data.equipment||{})};
    this.inventory=Array.isArray(data.inventory)?data.inventory.filter(i=>ITEM_DB[i.id]).map(i=>({id:i.id,count:i.count})):[{id:'potion',count:3}];
    this.skills={...(data.skills||{})};
    this.currency=data.currency||toBronze(20,29,53);
    this.bank=data.bank||0;
    this.currentLocation=data.currentLocation||HOME_CITY;
    this.homeCity=data.homeCity||HOME_CITY;
    this.visitedLocations=new Set(data.visitedLocations||[HOME_CITY]);
    this.tx=data.tx??12;this.ty=data.ty??12;
    this.px=this.tx;this.py=this.ty;
    this.dir='down';this.moving=false;this.moveTime=0;
    this.stamina=100;this.maxStamina=100;
    this.kills=data.kills||0;
    // Best records (highest floor EVER reached)
    this.dungeonBest=data.dungeonBest||0;
    this.towerBest=data.towerBest||0;
    this.dungeonRuns=data.dungeonRuns||0;
    this.towerRuns=data.towerRuns||0;
    this.achievements=data.achievements||0;
    this.deaths=data.deaths||0;
    this.guildRank=data.guildRank||'E';
    this.autoBattle=false;
    const cls=this.classData;
    const firstSkill=cls.skills[0];
    if(firstSkill&&!this.skills[firstSkill])this.skills[firstSkill]=1;
    this.hp=clamp(data.hp??this.maxHp,1,this.maxHp);
    this.mp=clamp(data.mp??this.maxMp,0,this.maxMp);
  }
  calcExpNext(lv){return Math.floor(25*Math.pow(lv,1.72)+10*lv);}
  get classData(){return CLASS_DB[this.classId]||CLASS_DB.archer;}
  get raceData(){return RACES[this.raceId]||RACES.human;}
  get secondClassData(){return SECOND_CLASSES.find(s=>s.id===this.secondClassId)||null;}
  _eqStat(k){let t=0;for(const s of Object.values(this.equipment)){if(!s)continue;const db=ITEM_DB[s];if(db&&db.stats&&db.stats[k])t+=db.stats[k];}return Math.floor(t*this._secondBonus('equipBonus'));}
  _raceMult(k){const r=this.raceData.bonus;return r[k]||1;}
  _classBonusMult(k){const wt=this.classData.weaponType;const magic=wt==='staff';const agile=wt==='dagger'||wt==='bow';if(k==='patk')return magic?1.0:1.05;if(k==='matk')return magic?1.08:1.0;if(k==='spd')return agile?1.06:1.02;return 1;}
  _secondBonus(k){const sc=this.secondClassData;if(!sc||typeof sc.bonus[k]!=='number')return 1;const g=1+(this.secondLevel-1)*0.05;return 1+(sc.bonus[k]-1)*g;}
  get totalStr(){return this.stats.str+this._eqStat('str');}
  get totalVit(){return this.stats.vit+this._eqStat('vit');}
  get totalAgi(){return this.stats.agi+this._eqStat('agi');}
  get totalInt(){return this.stats.int+this._eqStat('int');}
  get totalWis(){return this.stats.wis+this._eqStat('wis');}
  get maxHp(){const base=50+this.totalVit*8+this.level*6;return Math.floor(base*this._raceMult('hp')*this._secondBonus('hp'));}
  get maxMp(){const base=20+this.totalInt*6+this.totalWis*4+this.level*2;return Math.floor(base*this._raceMult('mp')*this._secondBonus('mp'));}
  get patk(){const base=10+this.totalStr*2.5+this._eqStat('patk')+this.level;return Math.floor(base*this._raceMult('patk')*this._classBonusMult('patk')*this._secondBonus('patk'));}
  get matk(){const base=8+this.totalInt*2.5+this._eqStat('matk')+this.level;return Math.floor(base*this._raceMult('matk')*this._classBonusMult('matk')*this._secondBonus('matk'));}
  get pdef(){return Math.floor((5+this.totalVit*1.5+this._eqStat('pdef'))*this._raceMult('pdef'));}
  get mdef(){return Math.floor(5+this.totalWis*1.5+this._eqStat('mdef'));}
  get spd(){return Math.floor((10+this.totalAgi*1.2+this._eqStat('spd'))*this._raceMult('spd')*this._classBonusMult('spd'));}
  get acc(){return 5+Math.floor(this.totalAgi*.3)+this._eqStat('acc');}
  get eva(){return 3+Math.floor(this.totalAgi*.2)+this._eqStat('eva')+(this.raceData.bonus.eva||0);}
  get mhit(){return 5+Math.floor(this.totalWis*.3)+this._eqStat('mhit');}
  get manaRegen(){return Math.floor(this.totalWis*.5)+this._eqStat('manaRegen');}
  get healPower(){return Math.floor(this.totalWis*1.5)+this._eqStat('healPower');}
  get statusResist(){return Math.floor(this.totalWis*.8)+this._eqStat('statusResist');}
  get penetration(){return 3.8+this._eqStat('penetration');}
  get critChance(){return clamp(.05+this.spd*.003,.05,.6);}
  get dodgeChance(){return clamp(.02+this.eva*.004,.02,.45);}
  healHp(v){const b=this.hp;this.hp=Math.min(this.maxHp,this.hp+v);return this.hp-b;}
  healMp(v){const b=this.mp;this.mp=Math.min(this.maxMp,this.mp+v);return this.mp-b;}
  addItem(id,n=1){if(!ITEM_DB[id])return;const ex=this.inventory.find(i=>i.id===id);if(ex)ex.count+=n;else this.inventory.push({id,count:n});}
  removeItem(id,n=1){const i=this.inventory.findIndex(it=>it.id===id);if(i<0||this.inventory[i].count<n)return false;this.inventory[i].count-=n;if(this.inventory[i].count<=0)this.inventory.splice(i,1);return true;}
  hasItem(id,n=1){const it=this.inventory.find(i=>i.id===id);return it&&it.count>=n;}
  equip(id){
    const db=ITEM_DB[id];
    if(!db||!db.slot||!this.hasItem(id))return{ok:false,reason:'invalid'};
    if(db.slot==='weapon'&&db.wtype&&db.wtype!==this.classData.weaponType)return{ok:false,reason:'class'};
    const old=this.equipment[db.slot];if(old)this.addItem(old,1);this.removeItem(id,1);this.equipment[db.slot]=id;
    this.hp=Math.min(this.hp,this.maxHp);this.mp=Math.min(this.mp,this.maxMp);
    return{ok:true};
  }
  unequip(slot){const id=this.equipment[slot];if(!id)return false;this.equipment[slot]=null;this.addItem(id,1);this.hp=Math.min(this.hp,this.maxHp);this.mp=Math.min(this.mp,this.maxMp);return true;}
  gainExp(exp){
    const cls=this.classData;const mult=this.raceData.expBonus||1;const gain=Math.floor(exp*mult);
    this.exp+=gain;const msgs=[];let guard=0;
    while(this.exp>=this.expNext&&guard<200){
      guard++;this.exp-=this.expNext;this.level++;this.expNext=this.calcExpNext(this.level);
      this.statPoints+=3;this.skillPoints+=1;this.hp=this.maxHp;this.mp=this.maxMp;
      for(const sk of cls.skills){const db=SKILL_DB[sk];if(db&&this.level>=db.unlock&&!this.skills[sk]){this.skills[sk]=1;msgs.push(`Skill baru: ${db.name}!`);}}
      msgs.push(`Level ${this.level}! +3 stat, +1 skill`);
      if(this.level%5===0)this.updateGuildRank();
    }
    if(this.secondClassId){
      this.secondExp+=gain;let secNext=Math.floor(15*Math.pow(1.25,this.secondLevel-1));let g2=0;
      while(this.secondExp>=secNext&&g2<200){g2++;this.secondExp-=secNext;this.secondLevel++;msgs.push(`${this.secondClassData.name} → Lv.${this.secondLevel}!`);secNext=Math.floor(15*Math.pow(1.25,this.secondLevel-1));}
    }
    return{msgs,gain};
  }
  updateGuildRank(){
    const p=this.power;let rank='E';
    if(p>=500000)rank='SSS+';else if(p>=200000)rank='SSS';else if(p>=80000)rank='SS';else if(p>=30000)rank='S';else if(p>=12000)rank='A';else if(p>=5000)rank='B';else if(p>=2000)rank='C';else if(p>=600)rank='D';
    if(GUILD_RANKS.indexOf(rank)>GUILD_RANKS.indexOf(this.guildRank))this.guildRank=rank;
  }
  get power(){return Math.floor(this.patk*2+this.matk*1.5+this.pdef+this.mdef+this.spd*2+this.maxHp*.1+this.maxMp*.05);}
  get powerRank(){const p=this.power;if(p>=200000)return'SSS';if(p>=80000)return'SS';if(p>=30000)return'S';if(p>=12000)return'A';if(p>=5000)return'B';if(p>=2000)return'C';if(p>=600)return'D';if(p>=200)return'E';return'F';}
  allocateStat(s){if(this.statPoints<=0)return false;if(!STAT_KEYS.includes(s))return false;this.stats[s]++;this.statPoints--;if(s==='vit')this.hp=Math.min(this.hp+8,this.maxHp);if(s==='int'||s==='wis')this.mp=Math.min(this.mp+6,this.maxMp);return true;}
  upgradeSkill(id){if(this.skillPoints<=0)return false;const db=SKILL_DB[id];if(!db||this.level<db.unlock)return false;this.skills[id]=(this.skills[id]||0)+1;this.skillPoints--;return true;}
  skillMpCost(id){const db=SKILL_DB[id];const lvl=this.skills[id]||1;return db.mp+Math.floor((lvl-1)/3);}
  skillMultiplier(id){const db=SKILL_DB[id];const lvl=this.skills[id]||1;return (db.mult||0)*(1+(lvl-1)*.12);}
  sortedInventory(mode){
    const arr=this.inventory.map(i=>({...i}));
    switch(mode){
      case 'name':arr.sort((a,b)=>(ITEM_DB[a.id]?.name||'').localeCompare(ITEM_DB[b.id]?.name||''));break;
      case 'count':arr.sort((a,b)=>b.count-a.count);break;
      case 'type':arr.sort((a,b)=>{const ta=ITEM_DB[a.id]?.slot?'zz_'+ITEM_DB[a.id].slot:(ITEM_DB[a.id]?.type||'');const tb=ITEM_DB[b.id]?.slot?'zz_'+ITEM_DB[b.id].slot:(ITEM_DB[b.id]?.type||'');return ta.localeCompare(tb);});break;
      case 'price':arr.sort((a,b)=>(ITEM_DB[b.id]?.price||0)-(ITEM_DB[a.id]?.price||0));break;
    }
    return arr;
  }
}

  generateLocation(locId){

    this.currentLoc=loc;this.gatherRespawns=[];

    const w=size,h=size;const biome=BIOMES[loc.biome]||BIOMES.plains;
    const tiles=[];
    for(let y=0;y<h;y++){
      const row=[];
      for(let x=0;x<w;x++){
        let t=biome.tiles[0];
        if(Math.random()<0.35)t=pick(biome.tiles);
        if(Math.random()<biome.solid){const solids=biome.tiles.filter(p=>SOLID.has(p));if(solids.length)t=pick(solids);}
        row.push(t);
      }
      tiles.push(row);
    }
    for(let x=0;x<w;x++){tiles[0][x]=T.WALL;tiles[h-1][x]=T.WALL;}
    for(let y=0;y<h;y++){tiles[y][0]=T.WALL;tiles[y][w-1]=T.WALL;}
    const cx=Math.floor(w/2),cy=Math.floor(h/2);
    for(let x=3;x<w-3;x++){if(SOLID.has(tiles[cy][x]))tiles[cy][x]=T.PATH;if(SOLID.has(tiles[cy+1][x]))tiles[cy+1][x]=T.PATH;}
    for(let y=3;y<h-3;y++){if(SOLID.has(tiles[y][cx]))tiles[y][cx]=T.PATH;if(SOLID.has(tiles[y][cx+1]))tiles[y][cx+1]=T.PATH;}
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){

    }

      for(let i=0;i<8;i++){const x=randInt(2,w-3),y=randInt(2,h-3);if(!SOLID.has(tiles[y][x]))tiles[y][x]=Math.random()<0.15?T.ORE_RARE:T.ORE;}
    }
    if(loc.biome==='forest'){for(let i=0;i<10;i++){const x=randInt(2,w-3),y=randInt(2,h-3);if(!SOLID.has(tiles[y][x])&&Math.random()<0.5)tiles[y][x]=T.TREE;}}
    if(loc.biome==='plains'||loc.biome==='village'){for(let i=0;i<6;i++){const x=randInt(2,w-3),y=randInt(2,h-3);if(!SOLID.has(tiles[y][x]))tiles[y][x]=Math.random()<0.3?T.TREE:(Math.random()<0.3?T.ROCK:T.FLOWER);}}
    this.world={w,h,tiles};
    const p=this.player;p.tx=cx;p.ty=cy;p.px=cx;p.py=cy;p.moving=false;p.moveTime=0;
    this.npcs=[];
    if(loc.npcs){
      let idx=0;
      for(const t of loc.npcs){
        const pos=this.findFreeTile(4+idx*2,3);
        if(pos){
          if(t==='sage')this.npcs.push({id:'sage',tx:pos.x,ty:pos.y,name:'Sage',color:'#8a5a8a',type:'dialog',lines:[`Selamat datang di ${loc.name}, {name} si {class}!`,loc.type==='city'?'Kota ini aman.':'Wilayah berbahaya, hati-hati.','Kumpulkan material: 🪨 batu, 🌲 pohon, 🌸 bunga.']});
          else if(t==='merchant')this.npcs.push({id:'merchant',tx:pos.x,ty:pos.y,name:'Merchant',color:'#c9a04a',type:'shop',lines:['Butuh item atau equipment?']});
          else if(t==='smith')this.npcs.push({id:'smith',tx:pos.x,ty:pos.y,name:'Blacksmith',color:'#8a4a3a',type:'craft_forge',lines:['Aku bisa menempa equipment untukmu!']});
          else if(t==='alchemist')this.npcs.push({id:'alchemist',tx:pos.x,ty:pos.y,name:'Alchemist',color:'#4a8a8a',type:'craft_alchemy',lines:['Ramuan atau potion? Aku bisa buat.']});
          else if(t==='cook')this.npcs.push({id:'cook',tx:pos.x,ty:pos.y,name:'Cook',color:'#c9a04a',type:'craft_cook',lines:['Makanan segar untuk petualang!']});
          else if(t==='raidmaster')this.npcs.push({id:'raidmaster',tx:pos.x,ty:pos.y,name:'Raid Master',color:'#c94a8a',type:'raid',lines:['Dungeon & Tower!']});
          else if(t==='banker')this.npcs.push({id:'banker',tx:pos.x,ty:pos.y,name:'Banker',color:'#4ac96a',type:'bank',lines:['Simpan uangmu agar aman dari penalti kematian!']});
        }
        idx++;
      }
    }
    this.enemies=[];
    if(loc.type!=='city'){
      const pool=this._monsterPoolFor(loc);
      if(pool&&pool.length>0){for(const [mid,count] of pool){for(let i=0;i<count;i++)this.spawnMonster(mid,loc.minLevel);}}
    }
    if(!p.visitedLocations.has(locId)){
      p.visitedLocations.add(locId);
      if(p.visitedLocations.size%5===0){p.achievements++;setTimeout(()=>this.showToast(`🏆 Achievement: ${p.visitedLocations.size} lokasi!`,2.6),1200);}
    }
    this.regionTitleText=loc.name;this.regionTitleTimer=3.0;
    this.updateCamera();
    saveGame(p);
  }

  findFreeTile(prefX,prefY){
    const w=this.world.w,h=this.world.h;
    for(let i=0;i<80;i++){
      const x=prefX+randInt(-5,5),y=prefY+randInt(-5,5);
      if(x<1||y<1||x>=w-1||y>=h-1)continue;
      if(SOLID.has(this.world.tiles[y][x]))continue;
      if(this.npcs.some(n=>n.tx===x&&n.ty===y))continue;
      if(this.enemies.some(e=>e.tx===x&&e.ty===y))continue;
      return{x,y};
    }
    return null;
  }

  spawnMonster(mid,baseLevel){
    const t=MONSTER_TEMPLATES[mid];if(!t)return;
    const lvl=Math.max(1,baseLevel||t.level||1);
    const p=this.player;let pos=null;
    for(let a=0;a<40;a++){
      const px=randInt(2,this.world.w-3),py=randInt(2,this.world.h-3);
      if(this.isSolid(px,py))continue;
      if(this.npcs.some(n=>n.tx===px&&n.ty===py))continue;
      if(this.enemies.some(e=>e.tx===px&&e.ty===py))continue;
      if(Math.abs(px-p.tx)+Math.abs(py-p.ty)<4)continue;
      pos={x:px,y:py};break;
    }
    if(!pos)return;
    const ratio=lvl/(t.level||lvl);
    const hp=Math.max(1,Math.floor(t.hp*Math.pow(ratio,1.2)));
    const atk=Math.max(1,Math.floor(t.atk*Math.pow(ratio,1.05)));
    const def=Math.max(0,Math.floor(t.def*ratio));
    const exp=Math.max(1,Math.floor(t.exp*Math.pow(ratio,1.35)));
    const gold=Math.max(1,Math.floor(t.gold*Math.pow(ratio,1.25)));
    this.enemies.push({tx:pos.x,ty:pos.y,id:mid,name:t.name,shape:t.shape,color:t.color,level:lvl,hp,maxHp:hp,atk,def,exp,gold,boss:!!t.boss,element:t.element,weak:t.weak||[],resist:t.resist||[],regen:t.regen||0,enrage:t.enrage||false,drops:t.drops||[],poison:0,stun:false});
  }

  updateRespawn(dt){
    this.respawnTimer-=dt;if(this.respawnTimer>0)return;
    this.respawnTimer=2.5;
    const loc=this.currentLoc;if(!loc||loc.type==='city')return;
    const target=8;if(this.enemies.length>=target)return;
    const pool=this._monsterPoolFor(loc);if(!pool||!pool.length)return;
    const valid=pool.filter(([id])=>MONSTER_TEMPLATES[id]&&!MONSTER_TEMPLATES[id].boss);
    if(!valid.length)return;
    let total=valid.reduce((s,m)=>s+m[1],0);let r=Math.random()*total,picked=valid[0];
    for(const m of valid){r-=m[1];if(r<=0){picked=m;break;}}
    let spawned=0;
    while(this.enemies.length<target&&spawned<3){this.spawnMonster(picked[0],loc.minLevel);spawned++;}
  }

  updateGatherRespawns(dt){
    for(let i=this.gatherRespawns.length-1;i>=0;i--){
      const r=this.gatherRespawns[i];r.timer-=dt;
      if(r.timer<=0){
        if(this.world&&r.locId===this.player.currentLocation){
          if(r.y<this.world.h&&r.x<this.world.w)this.world.tiles[r.y][r.x]=r.origType;
        }
        this.gatherRespawns.splice(i,1);
      }
    }
  }

  _monsterPoolFor(loc){
    const lv=loc.minLevel||1;
    const candidates=MONSTER_LIST.filter(id=>{const t=MONSTER_TEMPLATES[id];return t&&!t.boss&&Math.abs(t.level-lv)<Math.max(8,lv*0.4);});
    if(!candidates.length){
      const near=MONSTER_LIST.map(id=>({id,d:Math.abs(MONSTER_TEMPLATES[id].level-lv)})).sort((a,b)=>a.d-b.d).slice(0,5).map(o=>o.id);
      return near.map(id=>[id,3]);
    }
    const ranked=candidates.map(id=>({id,d:Math.abs(MONSTER_TEMPLATES[id].level-lv)})).sort((a,b)=>a.d-b.d).slice(0,5);
    return ranked.map((o,i)=>[o.id,Math.max(1,4-i)]);
  }

  setPlayer(p){this.player=p;this.generateLocation(p.currentLocation);this.state='world';}

  loop(now){
    const dt=Math.min((now-this.lastTime)/1000,0.05);
    this.lastTime=now;
    if(this.state!=='idle'){
      this.worldTime=(this.worldTime+dt*DAY_NIGHT_RATE)%1440;
      this.update(dt);this.render();
    }
    this.input.endFrame();
    requestAnimationFrame(this.loop);
  }

  update(dt){
    if(this.toast){this.toastTimer-=dt;if(this.toastTimer<=0)this.toast=null;}
    if(this.regionTitleTimer>0)this.regionTitleTimer-=dt;
    if(this.raidAnimTimer>0)this.raidAnimTimer-=dt;
    if(['world','menu','dialogue','shop','status','craft','raid_menu','bank'].includes(this.state))this.updateRespawn(dt);
    if(this.world&&this.player)this.updateGatherRespawns(dt);
    if(this.player){
      const p=this.player;
      p.mp=Math.min(p.maxMp,p.mp+p.manaRegen*0.01*dt*60);
      if(this.state!=='battle')p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.0008*p._secondBonus('hpRegen')*dt*60);
      p.stamina=Math.min(p.maxStamina,p.stamina+5*dt);
    }
    // Auto-battle toggle (works in world/battle states, not raid)
    if(this.input.pressed('auto')){
      if(this.player){
        if(this.battle&&this.battle._raid){this.showToast('⚡ Auto-battle tidak tersedia di Raid');}
        else{
          this.player.autoBattle=!this.player.autoBattle;
          this.showToast(this.player.autoBattle?'⚡ Auto-Battle ON':'⚡ Auto-Battle OFF',1.5);
        }
      }
    }
    switch(this.state){
      case 'world':this.updateWorld(dt);break;
      case 'dialogue':this.updateDialogue();break;
      case 'battle':this.updateBattle(dt);break;
      case 'menu':this.updateMenu();break;
      case 'shop':this.updateShop();break;
      case 'bank':this.updateBank();break;
      case 'worldmap':this.updateWorldMap();break;
      case 'status':this.updateStatus();break;
      case 'craft':this.updateCraft();break;
      case 'raid_menu':this.updateRaidMenu();break;
      case 'raid_intermission':
        this.raidInterTimer-=dt;
        if(this.raidInterTimer<=0)this.nextRaidBattle();
        break;
      case 'death_screen':this.deathScreenTimer-=dt;if(this.deathScreenTimer<=0||this.input.pressed('a'))this.respawnPlayer();break;
      case 'victory':if(this.input.pressed('a'))this.state='world';break;
    }
  }

  render(){
    switch(this.state){
      case 'world':this.renderWorld();break;
      case 'dialogue':this.renderWorld();this.renderDialogue();break;
      case 'menu':this.renderWorld();this.renderMenu();break;
      case 'battle':this.renderBattle();break;
      case 'shop':this.renderWorld();this.renderShop();break;
      case 'bank':this.renderWorld();this.renderBank();break;
      case 'worldmap':this.renderWorldMap();break;
      case 'status':this.renderStatus();break;
      case 'craft':this.renderWorld();this.renderCraft();break;
      case 'raid_menu':this.renderWorld();this.renderRaidMenu();break;
      case 'raid_intermission':this.renderRaidIntermission();break;
      case 'death_screen':this.renderDeathScreen();break;
      case 'victory':this.renderVictory();break;
    }
    if(this.toast)this.renderToast();
    if(this.regionTitleTimer>0)this.renderRegionTitle();
  }

  updateWorld(dt){
    const p=this.player;
    if(p.moving){
      p.moveTime+=dt*1000;
      if(p.moveTime>=MOVE_MS){p.moving=false;p.px=p.tx;p.py=p.ty;p.moveTime=0;}
    }else{
      let dx=0,dy=0;
      if(this.input.isDown('left'))dx=-1;
      else if(this.input.isDown('right'))dx=1;
      else if(this.input.isDown('up'))dy=-1;
      else if(this.input.isDown('down'))dy=1;
      if(dx||dy)this.tryMove(dx,dy);
      if(this.input.pressed('a')){
        const fdx=p.dir==='left'?-1:p.dir==='right'?1:0;
        const fdy=p.dir==='up'?-1:p.dir==='down'?1:0;
        const fx=p.tx+fdx,fy=p.ty+fdy;
        if(this.world&&fx>=0&&fy>=0&&fx<this.world.w&&fy<this.world.h){
          const t=this.world.tiles[fy][fx];
          if(GATHERABLE.has(t))this.gather(fx,fy,t);
        }
      }
    }
    if(this.input.pressed('b')){this.state='menu';this.menuTab=0;this.statSelect=0;this.skillSelect=0;this.itemSelect=0;this.equipSelect=0;this.classSelect=0;this.craftTab=0;this.craftIndex=0;}
    if(this.input.pressed('m')){this.state='worldmap';this.wmContinentIdx=this._contIdx(p.currentLocation);this.wmLocationIdx=0;}
    if(this.input.pressed('s')){this.state='status';this.statusScroll=0;}
    this.updateCamera();
  }

  gather(tx,ty,t){
    const p=this.player;const loc=this.currentLoc;const lvl=loc?loc.minLevel:1;
    const tier=clamp(Math.floor(lvl/50),0,14);let items=[];
    const origType=t;
    if(t===T.TREE){
      const count=Math.max(1,Math.floor(1+Math.random()*2*(p._secondBonus('woodYield')||1)));
      const id='wood_'+Math.min(tier,9)+'_'+randInt(0,1);
      if(ITEM_DB[id]){p.addItem(id,count);items.push([id,count]);}
    }else if(t===T.ROCK||t===T.ORE||t===T.ORE_RARE){
      const count=t===T.ORE_RARE?2:Math.max(1,Math.floor(1+Math.random()*2*(p._secondBonus('oreYield')||1)));
      const id='ore_'+Math.min(tier,14)+'_'+randInt(0,2);
      if(ITEM_DB[id]){p.addItem(id,count);items.push([id,count]);}
    }else if(t===T.FLOWER||t===T.GRASS){
      const id='herb_'+Math.min(tier,9)+'_'+randInt(0,1);
      if(ITEM_DB[id]){p.addItem(id,1);items.push([id,1]);}
    }
    if(items.length){
      const baseT=(t===T.FLOWER)?T.GRASS:T.GRASS_DARK;
      this.world.tiles[ty][tx]=baseT;
      this.gatherRespawns.push({x:tx,y:ty,origType,timer:TILE_RESPAWN_SECONDS,locId:p.currentLocation});
      const msg=items.map(([id,n])=>`${ITEM_DB[id].name} x${n}`).join(', ');
      this.showToast(`🌿 Gather: ${msg} (${TILE_RESPAWN_SECONDS}s)`,1.8);
      const gexp=Math.floor(2*Math.pow(lvl,1.1));
      const r=p.gainExp(gexp);
      if(r.msgs.length)setTimeout(()=>r.msgs.forEach((m,i)=>setTimeout(()=>this.showToast(m),300*i)),100);
      saveGame(p);
    }
  }

  _contIdx(locId){const loc=LOC_MAP[locId];if(!loc)return 0;const keys=Object.keys(CONTINENTS);return Math.max(0,keys.indexOf(loc.continent));}

  tryMove(dx,dy){
    const p=this.player;
    p.dir=dx<0?'left':dx>0?'right':dy<0?'up':'down';
    const nx=p.tx+dx,ny=p.ty+dy;
    const npc=this.npcs.find(n=>n.tx===nx&&n.ty===ny);
    if(npc){this.interactNpc(npc);return;}
    const enemy=this.enemies.find(e=>e.tx===nx&&e.ty===ny);
    if(enemy){this.startBattle(enemy);return;}
    if(this.isSolid(nx,ny))return;
    p.px=p.tx;p.py=p.ty;p.tx=nx;p.ty=ny;p.moving=true;p.moveTime=0;
  }

  interactNpc(npc){
    if(npc.type==='shop')this.openShop();
    else if(npc.type==='bank'){this.state='bank';this.bankTab=0;this.bankAmountIdx=0;}
    else if(npc.type==='craft_forge'){this.state='craft';this.craftTab=0;this.craftIndex=0;}
    else if(npc.type==='craft_alchemy'){this.state='craft';this.craftTab=1;this.craftIndex=0;}
    else if(npc.type==='craft_cook'){this.state='craft';this.craftTab=2;this.craftIndex=0;}
    else if(npc.type==='raid'){this.state='raid_menu';this.raidSelect=0;this.raidAnimTimer=0;}
    else this.startDialogue(npc);
  }
  isSolid(tx,ty){if(!this.world)return true;if(tx<0||ty<0||tx>=this.world.w||ty>=this.world.h)return true;return SOLID.has(this.world.tiles[ty][tx]);}
  playerRenderPos(){const p=this.player;if(!p.moving)return{x:p.tx,y:p.ty};const t=Math.min(1,p.moveTime/MOVE_MS);const e=1-Math.pow(1-t,2);return{x:p.px+(p.tx-p.px)*e,y:p.py+(p.ty-p.py)*e};}
  updateCamera(){
    const rp=this.playerRenderPos();
    const px=(rp.x+.5)*TILE,py=(rp.y+.5)*TILE;
    let cx=px-VIEW_W/2,cy=py-VIEW_H/2;
    cx=clamp(cx,0,Math.max(0,this.world.w*TILE-VIEW_W));
    cy=clamp(cy,0,Math.max(0,this.world.h*TILE-VIEW_H));
    this.camera.x=cx;this.camera.y=cy;
  }
  isNight(){return this.worldTime>=18*60||this.worldTime<6*60;}

  renderWorld(){
    const c=this.ctx;
    c.fillStyle='#0a0a16';c.fillRect(0,0,VIEW_W,VIEW_H);
    const cam=this.camera;
    const startX=Math.max(0,Math.floor(cam.x/TILE));
    const startY=Math.max(0,Math.floor(cam.y/TILE));
    const endX=Math.min(this.world.w,startX+VIEW_TX+2);
    const endY=Math.min(this.world.h,startY+VIEW_TY+2);
    for(let ty=startY;ty<endY;ty++)for(let tx=startX;tx<endX;tx++){drawTile(c,this.world.tiles[ty][tx],tx*TILE-cam.x,ty*TILE-cam.y);}
    const draws=[];
    for(const npc of this.npcs)draws.push({y:npc.ty,fn:()=>{
      drawNpc(c,npc,npc.tx*TILE-cam.x,npc.ty*TILE-cam.y,TILE);
      c.fillStyle='rgba(0,0,0,0.85)';c.font='bold 9px system-ui';c.textAlign='center';
      const nm=npc.name;const w=c.measureText(nm).width+8;
      c.fillRect(npc.tx*TILE-cam.x+TILE/2-w/2,npc.ty*TILE-cam.y-14,w,12);
      c.fillStyle='#ffe27a';c.fillText(nm,npc.tx*TILE-cam.x+TILE/2,npc.ty*TILE-cam.y-4);
      c.textAlign='left';
    }});
    for(const e of this.enemies){
      if(e.tx<startX-2||e.tx>endX+2||e.ty<startY-2||e.ty>endY+2)continue;
      const bob=Math.sin(performance.now()/300+e.tx)*1.5;
      draws.push({y:e.ty,fn:()=>{
        const x=e.tx*TILE-cam.x,y=e.ty*TILE-cam.y+bob;
        drawMonster(c,e.shape,x,y,TILE,e.color);
        c.fillStyle='rgba(0,0,0,0.85)';c.fillRect(x+TILE/2-20,y-16,40,14);
        c.fillStyle=e.boss?'#ffd700':'#fff';c.font='bold 10px system-ui';c.textAlign='center';
        c.fillText('Lv '+e.level,x+TILE/2,y-5);
        if(e.boss){c.fillStyle='#ffd700';c.font='bold 9px system-ui';c.fillText('BOSS',x+TILE/2,y-18);}
        c.textAlign='left';
      }});
    }
    const rp=this.playerRenderPos();
    draws.push({y:rp.y,fn:()=>{const x=rp.x*TILE-cam.x,y=rp.y*TILE-cam.y;drawHero(c,x,y,TILE,this.player.dir,this.player.moving,this.player.classData);}});
    draws.sort((a,b)=>a.y-b.y);
    for(const d of draws)d.fn();
    if(this.isNight()){c.fillStyle='rgba(10,20,60,0.32)';c.fillRect(0,0,VIEW_W,VIEW_H);}
    const hour=this.worldTime/60;
    if(hour>=17&&hour<19){c.fillStyle='rgba(255,120,40,0.12)';c.fillRect(0,0,VIEW_W,VIEW_H);}
    else if(hour>=5&&hour<7){c.fillStyle='rgba(255,200,120,0.10)';c.fillRect(0,0,VIEW_W,VIEW_H);}
    this.renderHUD();this.renderLocationBanner();
  }

  renderHUD(){
    const c=this.ctx,p=this.player;
    c.fillStyle='rgba(0,0,0,0.85)';c.fillRect(6,6,210,92);
    c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=1;c.strokeRect(6.5,6.5,209,91);
    c.fillStyle='#111';c.fillRect(12,12,198,9);
    c.fillStyle=p.hp/p.maxHp>0.3?'#e33':'#ff8a3a';c.fillRect(12,12,198*clamp(p.hp/p.maxHp,0,1),9);
    c.fillStyle='#fff';c.font='bold 9px system-ui';c.textAlign='left';c.fillText(`HP ${Math.max(0,Math.floor(p.hp))}/${p.maxHp}`,14,20);
    c.fillStyle='#111';c.fillRect(12,24,198,9);
    c.fillStyle='#4ac';c.fillRect(12,24,198*clamp(p.mp/p.maxMp,0,1),9);
    c.fillStyle='#fff';c.fillText(`MP ${Math.max(0,Math.floor(p.mp))}/${p.maxMp}`,14,32);
    c.fillStyle='#111';c.fillRect(12,36,198,6);
    c.fillStyle='#9c4';c.fillRect(12,36,198*clamp(p.stamina/p.maxStamina,0,1),6);
    c.fillStyle='#ffe27a';c.font='bold 11px system-ui';c.fillText(`${p.classData.emoji} ${p.classData.name}  Lv.${p.level}`,12,54);
    c.font='bold 9px system-ui';c.fillStyle='#fff';c.fillText(`${p.raceData.icon} ${p.raceData.name}`,12,68);
    c.fillStyle='#ffd700';c.textAlign='right';c.fillText(fmtCurrency(p.currency),208,54);
    c.fillStyle='#fff';c.fillText(`EXP ${fmt(p.exp)}/${fmt(p.expNext)}`,208,68);
    c.fillStyle='#7ac';c.font='bold 9px system-ui';c.fillText(`⚔${fmt(p.kills)} 🏰F${p.dungeonBest} 🗼F${p.towerBest}`,208,80);
    c.textAlign='left';
    const th=Math.floor(this.worldTime/60),tm=Math.floor(this.worldTime%60);
    const timeStr=`${String(th).padStart(2,'0')}:${String(tm).padStart(2,'0')}`;
    c.fillStyle=this.isNight()?'#8ac':'#ffe27a';c.font='bold 10px system-ui';
    c.fillText(`${this.isNight()?'🌙':'☀️'} ${timeStr}`,12,88);
    if(p.statPoints>0||p.skillPoints>0){
      c.fillStyle='#e33';c.beginPath();c.arc(208,14,7,0,Math.PI*2);c.fill();
      c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke();
      c.fillStyle='#fff';c.font='bold 9px system-ui';c.textAlign='center';
      c.fillText(String(p.statPoints+p.skillPoints),208,17);c.textAlign='left';
    }
    // Auto-battle indicator
    if(p.autoBattle){
      const pulse=(Math.sin(performance.now()/300)+1)/2;
      c.fillStyle=`rgba(200,120,255,${0.5+pulse*0.4})`;
      c.fillRect(6,102,210,16);
      c.strokeStyle='#fff';c.lineWidth=1;c.strokeRect(6.5,102.5,209,15);
      c.fillStyle='#fff';c.font='bold 10px system-ui';c.textAlign='center';
      c.fillText('⚡ AUTO-BATTLE ACTIVE',VIEW_W/2-100+105,114);c.textAlign='left';
    }
  }

  renderLocationBanner(){
    const c=this.ctx;const loc=this.currentLoc;if(!loc)return;
    c.fillStyle='rgba(0,0,0,0.85)';c.fillRect(VIEW_W-176,6,170,38);
    c.strokeStyle='rgba(255,255,255,0.35)';c.strokeRect(VIEW_W-175.5,6.5,169,37);
    c.font='bold 11px system-ui';c.textAlign='left';c.fillStyle='#ffe27a';
    c.fillText(`${loc.icon} ${loc.name.length>20?loc.name.slice(0,19)+'…':loc.name}`,VIEW_W-170,24);
    c.fillStyle='#aab';c.font='bold 9px system-ui';
    c.fillText(`${loc.region} · Lv.${loc.minLevel}+`,VIEW_W-170,36);
  }

  renderRegionTitle(){
    const c=this.ctx;const alpha=Math.min(1,this.regionTitleTimer/0.8);

  wrapText(text,x,y,maxW,lineH){
    const c=this.ctx;const words=text.split(' ');let line='',yy=y;
    for(const w of words){
      const test=line?line+' '+w:w;
      if(c.measureText(test).width>maxW){c.fillText(line,x,yy);yy+=lineH;line=w;}else line=test;
    }
    if(line)c.fillText(line,x,yy);
  }

  /* BANK */
  updateBank(){
    if(this.input.pressed('b')){saveGame(this.player);this.state='world';return;}
    if(this.input.pressed('left')){this.bankTab=(this.bankTab+1)%2;this.bankAmountIdx=0;return;}
    if(this.input.pressed('right')){this.bankTab=(this.bankTab+1)%2;this.bankAmountIdx=0;return;}
    const N=BANK_PRESETS.length;
    if(this.input.pressed('up'))this.bankAmountIdx=(this.bankAmountIdx+N-1)%N;
    if(this.input.pressed('down'))this.bankAmountIdx=(this.bankAmountIdx+1)%N;
    if(this.input.pressed('a')){
      const p=this.player;
      const preset=BANK_PRESETS[this.bankAmountIdx];
      if(this.bankTab===0){
        let amt=preset==='ALL'?p.currency:preset;
        amt=Math.min(amt,p.currency);
        if(amt<=0){this.showToast('Tidak ada uang untuk disimpan');return;}
        p.currency-=amt;p.bank=(p.bank||0)+amt;
        this.showToast(`🏦 Deposit ${fmtCurrency(amt)}`,2.0);
        saveGame(p);
      }else{
        let amt=preset==='ALL'?(p.bank||0):preset;
        amt=Math.min(amt,p.bank||0);
        if(amt<=0){this.showToast('Bank kosong');return;}
        p.bank-=amt;p.currency+=amt;
        this.showToast(`🏦 Withdraw ${fmtCurrency(amt)}`,2.0);
        saveGame(p);
      }
    }
  }

  updateWorldMap(){
    const continents=Object.keys(CONTINENTS);
    const locs=LOCATIONS.filter(l=>l.continent===continents[this.wmContinentIdx]);
    if(this.input.pressed('left')){this.wmContinentIdx=(this.wmContinentIdx+continents.length-1)%continents.length;this.wmLocationIdx=0;}
    if(this.input.pressed('right')){this.wmContinentIdx=(this.wmContinentIdx+1)%continents.length;this.wmLocationIdx=0;}
    if(this.input.pressed('up'))this.wmLocationIdx=Math.max(0,this.wmLocationIdx-1);
    if(this.input.pressed('down'))this.wmLocationIdx=Math.min(locs.length-1,this.wmLocationIdx+1);
    if(this.input.pressed('b')||this.input.pressed('m')){this.state='world';return;}
    if(this.input.pressed('a')){
      const loc=locs[this.wmLocationIdx];if(!loc)return;
      if(this.player.level<loc.minLevel){this.showToast(`Butuh Lv.${loc.minLevel}!`);return;}
      if(loc.id===this.player.currentLocation){this.showToast('Sudah di sini');return;}
      this.player.currentLocation=loc.id;
      this.generateLocation(loc.id);
      this.state='world';
      this.showToast(`Travel ke ${loc.name}`,2);
    }
  }

  /* Raid battle: no scaling, monster template as-is */
  nextRaidBattle(){
    if(!this.raidActive)return;
    const p=this.player;
    const offsetPerFloor=this.raidType==='tower'?3:2;
    const targetLvl=Math.max(1,p.level+Math.floor((this.raidFloor-1)*offsetPerFloor));

    const allMons=MONSTER_LIST.filter(id=>{
      const t=MONSTER_TEMPLATES[id];
      return t&&!t.boss;
    });
    if(allMons.length===0){this.endRaid(false);return;}

    const sorted=allMons.slice().sort((a,b)=>
      Math.abs(MONSTER_TEMPLATES[a].level-targetLvl)-
      Math.abs(MONSTER_TEMPLATES[b].level-targetLvl)
    );
    const pool=sorted.slice(0,Math.min(12,sorted.length));
    const mid=pick(pool);
    const t=MONSTER_TEMPLATES[mid];

    const isBoss=this.raidType==='dungeon'&&this.raidFloor===this.raidMaxFloor;
    const isElite=this.raidFloor%5===0;

    const hp=isBoss?t.hp*3:isElite?Math.floor(t.hp*1.4):t.hp;
    const atk=isBoss?Math.floor(t.atk*1.2):isElite?Math.floor(t.atk*1.1):t.atk;
    const def=isBoss?Math.floor(t.def*1.3):isElite?Math.floor(t.def*1.15):t.def;
    const exp=isBoss?Math.floor(t.exp*2.5):isElite?Math.floor(t.exp*1.5):t.exp;
    const gold=isBoss?Math.floor(t.gold*2.5):isElite?Math.floor(t.gold*1.5):t.gold;

    const enemy={
      tx:-1,ty:-1,id:mid,
      name:(isBoss?'💀 BOSS ':'')+(isElite?'⭐ ':'')+t.name,
      shape:t.shape,color:t.color,
      level:t.level,
      hp,maxHp:hp,atk,def,exp,gold,boss:isBoss,element:t.element,
      weak:t.weak||[],resist:t.resist||[],regen:t.regen||0,enrage:t.enrage||false,
      drops:[],poison:0,stun:false,
    };
    this.startBattle(enemy);
    this.battle._raid=true;
  }

  startBattle(enemy){
    this.state='battle';
    this.battle={enemy:{...enemy,drops:enemy.drops||[]},enemyRef:enemy,turn:'player',timer:0,
      message:`${enemy.name} (Lv ${enemy.level}) muncul!`,playerAnim:0,enemyAnim:0,shakeT:0,
      atkBuff:1,dodgeBuff:0,battleSub:null,_cancelTurn:false,_flee:false,_raid:false,_autoTimer:0};
    this.battleMenu=0;this.battleSubIndex=0;
  }
  battleOptions(){return['Attack','Skill','Item','Flee'];}
  battleSkills(){return Object.keys(this.player.skills).filter(id=>this.player.skills[id]>0&&SKILL_DB[id]);}
  battleItems(){return this.player.inventory.filter(i=>{const t=ITEM_DB[i.id]?.type;return t==='heal'||t==='mana'||t==='fullheal'||t==='damage';});}

  updateBattle(dt){
    const b=this.battle,p=this.player;
    b.playerAnim*=.85;b.enemyAnim*=.85;
    if(b.shakeT>0)b.shakeT-=dt;
    if(b.turn==='poisonTick'){
      if(b.enemy.poison>0){const d=b.enemy.poison;b.enemy.hp=Math.max(0,b.enemy.hp-d);b.message=`${b.enemy.name} terkena racun! -${d} HP`;b.enemy.poison--;}
      b.turn='waitPoison';b.timer=.6;return;
    }
    if(b.turn==='waitPoison'){b.timer-=dt;if(b.timer<=0){if(b.enemy.hp<=0){this.winBattle();return;}b.turn='enemyTurn';this.enemyAttack();}return;}
    if(b.turn==='waitMessage'){
      b.timer-=dt;
      if(b.timer<=0){
        if(b._cancelTurn){b._cancelTurn=false;b.turn='player';return;}
        if(b._flee){b._flee=false;this.endBattle(true);return;}
        if(b.enemy.hp<=0){this.winBattle();return;}
        b.turn=b.enemy.poison>0?'poisonTick':'enemyTurn';
        if(b.turn==='enemyTurn')this.enemyAttack();
      }return;
    }
    if(b.turn==='waitEnemyMsg'){b.timer-=dt;if(b.timer<=0){
      if(p.hp<=0){this.handlePlayerDeath();return;}
      b.turn='player';b.message='Giliranmu.';
    }return;}
    if(b.turn==='player'){
      // AUTO-BATTLE (only in non-raid battles)
      if(p.autoBattle && !b._raid && b.battleSub===null){
        b._autoTimer=(b._autoTimer||0)+dt;
        // Safety: stop auto if HP too low AND no healing items
        if(p.hp/p.maxHp<0.20){
          const heals=this.battleItems().filter(i=>{const t=ITEM_DB[i.id].type;return t==='heal'||t==='fullheal';});
          if(heals.length===0){
            p.autoBattle=false;
            this.showToast('⚡ Auto-battle OFF (HP kritis!)',2.0);
          }
        }
        if(b._autoTimer>=0.5 && p.autoBattle){
          b._autoTimer=0;
          this.autoBattleAction();
          return;
        }
      }
      if(b.battleSub===null){
        const opts=this.battleOptions();
        if(this.input.pressed('up'))this.battleMenu=(this.battleMenu+opts.length-1)%opts.length;
        if(this.input.pressed('down'))this.battleMenu=(this.battleMenu+1)%opts.length;
        if(this.input.pressed('a'))this.battleSelectMain();
      }else if(b.battleSub==='skill'){
        const list=this.battleSkills();
        if(list.length===0){b.battleSub=null;return;}
        this.battleSubIndex=clamp(this.battleSubIndex,0,list.length-1);
        if(this.input.pressed('up'))this.battleSubIndex=(this.battleSubIndex+list.length-1)%list.length;
        if(this.input.pressed('down'))this.battleSubIndex=(this.battleSubIndex+1)%list.length;
        if(this.input.pressed('a'))this.useSkill(list[this.battleSubIndex]);
        if(this.input.pressed('b'))b.battleSub=null;
      }else if(b.battleSub==='item'){
        const items=this.battleItems();
        if(items.length===0){b.battleSub=null;return;}
        this.battleSubIndex=clamp(this.battleSubIndex,0,items.length-1);
        if(this.input.pressed('up'))this.battleSubIndex=(this.battleSubIndex+items.length-1)%items.length;
        if(this.input.pressed('down'))this.battleSubIndex=(this.battleSubIndex+1)%items.length;
        if(this.input.pressed('a'))this.useBattleItem(items[this.battleSubIndex]);
        if(this.input.pressed('b'))b.battleSub=null;
      }
    }
  }

  /* AUTO BATTLE LOGIC */
  autoBattleAction(){
    const b=this.battle,p=this.player;
    if(!b||!p)return;
    // Priority 1: Heal if HP < 35%
    if(p.hp/p.maxHp<0.35){
      const heals=this.battleItems().filter(i=>{
        const t=ITEM_DB[i.id].type;
        return t==='heal'||t==='fullheal';
      });
      if(heals.length){
        heals.sort((a,b2)=>(ITEM_DB[b2.id].value||99999)-(ITEM_DB[a.id].value||99999));
        return this.useBattleItem(heals[0]);
      }
    }
    // Priority 2: Strong skill if MP >= 40% and MP sufficient
    const skills=this.battleSkills();
    if(skills.length && p.mp/p.maxMp>=0.4){
      const affordable=skills.filter(id=>p.mp>=p.skillMpCost(id));
      const dmgSkills=affordable.filter(id=>{
        const t=SKILL_DB[id].type;
        return t==='phys'||t==='magic';
      });
      if(dmgSkills.length){
        dmgSkills.sort((a,b2)=>p.skillMultiplier(b2)-p.skillMultiplier(a));
        // Only use if enemy HP is high enough to warrant skill
        if(b.enemy.hp > p.patk * 1.5){
          return this.useSkill(dmgSkills[0]);
        }
      }
    }
    // Default: basic attack
    return this.playerAttack();
  }

  battleSelectMain(){
    const b=this.battle;const opt=this.battleOptions()[this.battleMenu];
    if(opt==='Attack')return this.playerAttack();
    if(opt==='Skill'){if(this.battleSkills().length===0){b.message='Tidak ada skill!';b.turn='waitMessage';b.timer=.8;b._cancelTurn=true;return;}b.battleSub='skill';this.battleSubIndex=0;return;}
    if(opt==='Item'){if(this.battleItems().length===0){b.message='Tidak ada item!';b.turn='waitMessage';b.timer=.8;b._cancelTurn=true;return;}b.battleSub='item';this.battleSubIndex=0;return;}
    if(opt==='Flee')return this.tryFlee();
  }
  elementMult(element,enemy){
    if(!element)return 1;
    if(enemy.weak&&enemy.weak.includes(element))return 1.4;
    if(enemy.resist&&enemy.resist.includes(element))return 0.7;
    return 1;
  }
  playerAttack(){
    const b=this.battle,p=this.player;
    const base=Math.floor(p.patk*b.atkBuff);const crit=chance(p.critChance);
    const em=this.elementMult('physical',b.enemy);
    let dmg=Math.max(1,Math.floor((base-b.enemy.def+randInt(-2,2))*em));
    if(crit)dmg=Math.floor(dmg*1.6);
    b.enemy.hp=Math.max(0,b.enemy.hp-dmg);b.enemyAnim=8;b.shakeT=.28;
    const tag=em>1?' (Weak!)':em<1?' (Resist)':'';
    b.message=(crit?`CRIT! Kamu menyerang -${dmg} HP`:`Kamu menyerang! -${dmg} HP`)+tag;
    b.turn='waitMessage';b.timer=.75;
  }
  useSkill(skillId){
    const b=this.battle,p=this.player;
    const db=SKILL_DB[skillId];if(!db){b.battleSub=null;return;}
    const lvl=p.skills[skillId]||1;const mpCost=p.skillMpCost(skillId);
    if(p.mp<mpCost){b.message='MP tidak cukup!';b.turn='waitMessage';b.timer=.8;b._cancelTurn=true;b.battleSub=null;return;}
    p.mp-=mpCost;b.battleSub=null;
    if(db.type==='heal'){const heal=Math.floor(p.healPower*(db.heal||.3)+p.maxHp*.05);const v=p.healHp(heal);b.message=`${db.name}! +${v} HP`;b.turn='waitMessage';b.timer=.85;return;}
    if(db.type==='buff'){
      if(db.atkUp){b.atkBuff=1+db.atkUp;b.message=`${db.name}! ATK naik 50%`;}
      if(db.dodgeUp){b.dodgeBuff=db.dodgeUp;b.message=`${db.name}! Dodge naik`;}
      b.turn='waitMessage';b.timer=.85;return;
    }
    const mult=p.skillMultiplier(skillId);const crit=chance(p.critChance+(db.critBonus||0));
    let base;
    if(db.type==='magic')base=Math.floor(p.matk*mult)-Math.floor(b.enemy.def*.5);
    else base=Math.floor(p.patk*b.atkBuff*mult)-b.enemy.def;
    const em=this.elementMult(db.element,b.enemy);
    let dmg=Math.max(1,Math.floor((base+randInt(-2,2))*em));
    if(crit)dmg=Math.floor(dmg*1.6);
    b.enemy.hp=Math.max(0,b.enemy.hp-dmg);b.enemyAnim=10;b.shakeT=.32;
    let extra=em>1?' (Weak!)':em<1?' (Resist)':'';
    if(db.poison){b.enemy.poison=db.poison+Math.floor(lvl/2);extra+=' +Racun!';}
    if(db.stun&&chance(Math.min(.7,db.stun+lvl*.02))){b.enemy.stun=true;extra+=' +Stun!';}
    if(db.freeze&&chance(Math.min(.7,db.freeze+lvl*.02))){b.enemy.stun=true;extra+=' +Beku!';}
    b.message=`${db.name} Lv${lvl}${crit?' CRIT':''}! -${dmg} HP${extra}`;
    b.turn='waitMessage';b.timer=.9;
  }
  useBattleItem(it){
    const b=this.battle,p=this.player;
    if(!it){b.battleSub=null;return;}
    const db=ITEM_DB[it.id];if(!db){b.battleSub=null;return;}
    const t=db.type;
    if(t!=='heal'&&t!=='mana'&&t!=='fullheal'&&t!=='damage'){b.message='Tidak bisa dipakai.';b.turn='waitMessage';b.timer=.7;b._cancelTurn=true;b.battleSub=null;return;}
    if(!p.removeItem(it.id,1)){b.battleSub=null;return;}
    b.battleSub=null;
    if(t==='heal'){const v=p.healHp(Math.floor(db.value*p._secondBonus('potionEffect')));b.message=`${db.name}! +${v} HP`;}
    else if(t==='mana'){const v=p.healMp(Math.floor(db.value*p._secondBonus('potionEffect')));b.message=`${db.name}! +${v} MP`;}
    else if(t==='fullheal'){p.hp=p.maxHp;b.message=`${db.name}! HP penuh!`;}
    else if(t==='damage'){b.enemy.hp=Math.max(0,b.enemy.hp-db.value);b.enemyAnim=10;b.shakeT=.3;b.message=`${db.name}! -${db.value} HP`;}
    b.turn='waitMessage';b.timer=.75;
  }
  tryFlee(){
    const b=this.battle;
    if(b.enemy.boss&&!b._raid){b.message='Tidak bisa kabur dari BOSS!';b.turn='waitMessage';b.timer=.9;return;}
    if(chance(.55)){b.message='Kamu kabur!';b.turn='waitMessage';b.timer=.8;b._flee=true;}
    else{b.message='Gagal kabur!';b.turn='waitMessage';b.timer=.75;}
  }
  enemyAttack(){
    const b=this.battle,p=this.player;
    if(b.enemy.stun){b.enemy.stun=false;b.message=`${b.enemy.name} terstun!`;b.turn='waitEnemyMsg';b.timer=.7;return;}
    if(chance(p.dodgeChance+b.dodgeBuff)){b.message=`Kamu menghindari serangan!`;b.turn='waitEnemyMsg';b.timer=.7;return;}
    let regenMsg='';
    if(b.enemy.regen&&b.enemy.hp>0&&b.enemy.hp<b.enemy.maxHp){
      const heal=Math.max(1,Math.floor(b.enemy.maxHp*b.enemy.regen));
      b.enemy.hp=Math.min(b.enemy.maxHp,b.enemy.hp+heal);regenMsg=` ${b.enemy.name} pulih +${heal} HP!`;
    }
    const enraged=b.enemy.enrage&&b.enemy.hp/b.enemy.maxHp<=.3;
    const atkMult=enraged?1.4:1;
    const base=Math.max(1,Math.floor(b.enemy.atk*atkMult)-p.pdef);
    const dmg=Math.max(1,base+randInt(-2,2));
    p.hp=Math.max(0,p.hp-dmg);b.playerAnim=8;
    b.message=`${enraged?'🔥ENRAGE! ':''}${b.enemy.name} menyerang! -${dmg} HP${regenMsg}`;
    b.turn='waitEnemyMsg';b.timer=.85;
  }

    if(fled&&this.battle&&this.battle._raid){this.endRaid(false);return;}

  winBattle(){
    const b=this.battle;const enemy=b.enemy;
    const wasRaid=b._raid;
    const idx=this.enemies.indexOf(b.enemyRef);
    if(idx>=0)this.enemies.splice(idx,1);
    if(enemy.boss&&!wasRaid)this.bossKilled=true;
    const p=this.player;
    p.kills=(p.kills||0)+1;
    if(p.kills%100===0)p.achievements++;
    p.updateGuildRank();
    const result=p.gainExp(enemy.exp);
    const goldMult=p._secondBonus('goldGain');
    const bronzeGain=Math.floor(enemy.gold*KILL_MULT*goldMult);
    p.currency+=bronzeGain;
    const drops=[];
    const tier=clamp(Math.floor(enemy.level/60),0,9);
    const matRoll=randInt(0,2);
    if(matRoll===0){const id='ore_'+tier+'_0';if(ITEM_DB[id]){p.addItem(id,randInt(1,2));drops.push(ITEM_DB[id].name);}}
    else if(matRoll===1){const id='herb_'+Math.min(tier,9)+'_0';if(ITEM_DB[id]){p.addItem(id,1);drops.push(ITEM_DB[id].name);}}
    else{const id='drop_'+tier+'_'+randInt(0,9);if(ITEM_DB[id]){p.addItem(id,1);drops.push(ITEM_DB[id].name);}}
    if(chance(0.06+enemy.level*0.0005)){
      const pool=MONSTER_DROP_POOL(enemy.level);
      if(pool.length){const id=pick(pool);p.addItem(id,1);drops.push(ITEM_DB[id].name+'★');}
    }
    let msg=`+${fmt(result.gain)} EXP  +${fmtCurrency(bronzeGain)}`;
    if(drops.length)msg+=`  | Drop: ${drops.join(', ')}`;
    this.showToast(msg,2.8);
    result.msgs.forEach((m,i)=>setTimeout(()=>this.showToast(m,2.2),400*(i+1)));
    p.hp=Math.max(1,Math.min(p.hp,p.maxHp));

    if(wasRaid){
      // Record tracking: only updates best if we exceed it
      let newRecord=false;
      if(this.raidType==='dungeon'){
        if(this.raidFloor > p.dungeonBest){
          p.dungeonBest = this.raidFloor;
          newRecord=true;
          this.newRecordFloor = this.raidFloor;
        }
      }else if(this.raidType==='tower'){
        if(this.raidFloor > p.towerBest){
          p.towerBest = this.raidFloor;
          newRecord=true;
          this.newRecordFloor = this.raidFloor;
        }
      }
      this.raidGainedExp += result.gain;
      this.raidGainedGold += bronzeGain;
      this.raidKills++;
      saveGame(p);
      this.battle=null;
      this.raidFloor++;
      if(this.raidType==='dungeon'){
        if(this.raidFloor > this.raidMaxFloor){
          this.endRaid(true);
          return;
        }
      }
      // Heal between floors
      p.hp=Math.min(p.maxHp,p.hp+Math.floor(p.maxHp*0.35));
      p.mp=Math.min(p.maxMp,p.mp+Math.floor(p.maxMp*0.35));
      this.raidInterTimer=1.5;
      this.state='raid_intermission';
      return;
    }
    saveGame(p);
    this.battle=null;
    if(enemy.boss){this.state='victory';return;}
    this.state='world';
  }

    if(this.menuTab===0){
      if(this.input.pressed('up'))this.statSelect=(this.statSelect+STAT_KEYS.length-1)%STAT_KEYS.length;
      if(this.input.pressed('down'))this.statSelect=(this.statSelect+1)%STAT_KEYS.length;
      if(this.input.pressed('a')){
        const key=STAT_KEYS[this.statSelect];
        if(p.statPoints<=0)this.showToast('Tidak ada stat point!');
        else if(p.allocateStat(key)){this.showToast(`+1 ${STAT_LABELS[key]}`);saveGame(this.player);}
      }
      return;
    }
    if(this.menuTab===1){
      const list=Object.keys(p.skills).filter(id=>SKILL_DB[id]);
      if(list.length===0)return;
      this.skillSelect=clamp(this.skillSelect,0,list.length-1);
      if(this.input.pressed('up'))this.skillSelect=(this.skillSelect+list.length-1)%list.length;
      if(this.input.pressed('down'))this.skillSelect=(this.skillSelect+1)%list.length;
      if(this.input.pressed('a')){
        const id=list[this.skillSelect];const db=SKILL_DB[id];
        if(p.upgradeSkill(id)){this.showToast(`${db.name} → Lv ${p.skills[id]}`);saveGame(this.player);}
        else this.showToast(p.skillPoints<=0?'Tidak ada skill point':'Tidak bisa upgrade');
      }
      return;
    }
    if(this.menuTab===2){
      const inv=p.sortedInventory(SORT_MODES[this.sortMode]);
      const total=1+inv.length;
      this.itemSelect=clamp(this.itemSelect,0,total-1);
      if(this.input.pressed('up'))this.itemSelect=(this.itemSelect+total-1)%total;
      if(this.input.pressed('down'))this.itemSelect=(this.itemSelect+1)%total;
      if(this.input.pressed('a')){
        if(this.itemSelect===0){this.sortMode=(this.sortMode+1)%SORT_MODES.length;this.itemSelect=0;this.showToast('Sort: '+SORT_LABELS[SORT_MODES[this.sortMode]]);}
        else{
          const it=inv[this.itemSelect-1];if(!it)return;
          const db=ITEM_DB[it.id];if(!db)return;
          if(db.slot){
            const r=p.equip(it.id);
            if(r.ok){this.showToast(`Equip: ${db.name}`);saveGame(this.player);}
            else if(r.reason==='class')this.showToast(`${p.classData.name} tidak bisa pakai ${db.name}!`);
          }
          else if(db.type==='heal'){const v=p.healHp(Math.floor(db.value*p._secondBonus('potionEffect')));p.removeItem(it.id,1);this.showToast(`${db.name} +${v} HP`);saveGame(this.player);}
          else if(db.type==='mana'){const v=p.healMp(Math.floor(db.value*p._secondBonus('potionEffect')));p.removeItem(it.id,1);this.showToast(`${db.name} +${v} MP`);saveGame(this.player);}
          else if(db.type==='fullheal'){p.hp=p.maxHp;p.removeItem(it.id,1);this.showToast('HP penuh!');saveGame(this.player);}
          else if(db.type==='damage')this.showToast('Hanya di battle!');
        }
      }
      return;
    }
    if(this.menuTab===3){
      const list=SLOT_ORDER;
      this.equipSelect=clamp(this.equipSelect,0,list.length-1);
      if(this.input.pressed('up'))this.equipSelect=(this.equipSelect+list.length-1)%list.length;
      if(this.input.pressed('down'))this.equipSelect=(this.equipSelect+1)%list.length;
      if(this.input.pressed('a')){
        const slot=list[this.equipSelect];
        if(p.equipment[slot]){if(p.unequip(slot)){this.showToast(`Unequip ${SLOT_LABEL[slot]}`);saveGame(this.player);}}
        else this.showToast('Kosong');
      }
      return;
    }
    if(this.menuTab===4)this.updateClassTab();
    if(this.menuTab===5){if(this.input.pressed('a')){this.state='craft';this.craftTab=0;this.craftIndex=0;}}
  }
  updateClassTab(){
    const p=this.player;
    if(this.classSubTab===0){
      if(this.input.pressed('a')){this.classSubTab=1;this.classSelect=0;return;}
      if(this.input.pressed('left')){this.classSubTab=2;this.classSelect=0;return;}
      if(this.input.pressed('right')){this.classSubTab=1;this.classSelect=0;return;}
      return;
    }
    if(this.input.pressed('b')){this.classSubTab=0;return;}
    if(this.classSubTab===1){
      const evos=evolutionPathsFrom(p.classId);
      if(evos.length===0){if(this.input.pressed('a'))this.showToast('Tidak ada evolusi tersedia');return;}
      this.classSelect=clamp(this.classSelect,0,evos.length-1);
      if(this.input.pressed('up'))this.classSelect=(this.classSelect+evos.length-1)%evos.length;
      if(this.input.pressed('down'))this.classSelect=(this.classSelect+1)%evos.length;
      if(this.input.pressed('a')){
        const target=evos[this.classSelect];const tier=target.evolvesFrom.length>=2?2:1;const req=evoRequirement(tier);
        if(p.level<req.lvl){this.showToast(`Butuh Lv.${req.lvl} untuk evolusi!`);return;}
        if(p.currency<req.cost){this.showToast(`Butuh ${fmtCurrency(req.cost)} untuk evolusi!`);return;}
        p.currency-=req.cost;p.classId=target.id;
        const s1=target.skills[0];if(s1&&!p.skills[s1])p.skills[s1]=1;
        this.showToast(`⭐ Evolusi! → ${target.name}`,2.5);saveGame(p);this.classSubTab=0;this.classSelect=0;
      }
      return;
    }
    if(this.classSubTab===2){
      const curList=SECOND_CLASSES;
      this.classSelect=clamp(this.classSelect,0,curList.length-1);
      if(this.input.pressed('up'))this.classSelect=(this.classSelect+curList.length-1)%curList.length;
      if(this.input.pressed('down'))this.classSelect=(this.classSelect+1)%curList.length;
      if(this.input.pressed('a')){
        if(p.secondClassId){this.showToast('Second class sudah dipilih permanen!');return;}
        if(p.level<10){this.showToast('Butuh Lv.10 untuk pilih second class');return;}
        const target=curList[this.classSelect];
        p.secondClassId=target.id;p.secondLevel=1;p.secondExp=0;
        this.showToast(`🎯 Second class → ${target.name}`,2.5);saveGame(p);this.classSubTab=0;
      }
      return;
    }
  }
  _resetSelects(){
    if(this.menuTab===0)this.statSelect=0;
    else if(this.menuTab===1)this.skillSelect=0;
    else if(this.menuTab===2)this.itemSelect=0;
    else if(this.menuTab===3)this.equipSelect=0;
    else if(this.menuTab===4){this.classSelect=0;this.classSubTab=0;}
    else if(this.menuTab===5){this.craftIndex=0;this.craftTab=0;}
  }

  openShop(){this.state='shop';this.shopTab=0;this.shopIndex=0;}
  shopStock(){
    const plv=this.player.level;
    const minLv=Math.max(1,plv-15);const maxLv=plv+20;
    const cap=Math.floor((plv+5)*80);
    const wt=this.player.classData.weaponType;
    const catOrder=id=>{const db=ITEM_DB[id];if(db.slot==='weapon')return 0;if(db.slot)return 1+SLOT_ORDER.indexOf(db.slot);return 10;};
    const all=Object.keys(ITEM_DB).filter(id=>{
      const db=ITEM_DB[id];if(!db)return false;
      if(db.price>cap)return false;
      if(db.level&&(db.level<minLv||db.level>maxLv))return false;
      return true;
    }).sort((a,b)=>{
      const da=ITEM_DB[a],dbb=ITEM_DB[b];const ca=catOrder(a),cb=catOrder(b);
      if(ca!==cb)return ca-cb;
      if(ca===0){const ma=da.wtype===wt?0:1,mb=dbb.wtype===wt?0:1;if(ma!==mb)return ma-mb;}
      return da.price-dbb.price;
    });
    return all.slice(0,120);
  }
  updateShop(){
    const p=this.player;
    if(this.input.pressed('b')){saveGame(this.player);this.state='world';return;}
    if(this.input.pressed('left')||this.input.pressed('right')){this.shopTab=(this.shopTab+1)%2;this.shopIndex=0;return;}
    if(this.shopTab===0){
      const list=this.shopStock();
      if(this.input.pressed('up'))this.shopIndex=(this.shopIndex+list.length-1)%list.length;
      if(this.input.pressed('down'))this.shopIndex=(this.shopIndex+1)%list.length;
      if(this.input.pressed('a')){
        const id=list[this.shopIndex],db=ITEM_DB[id];if(!db)return;
        const discount=this.player._secondBonus('shopDiscount');
        const price=Math.floor(db.price*SHOP_MULT*discount);
        if(p.currency<price){this.showToast('Uang kurang!');return;}
        p.currency-=price;p.addItem(id,1);this.showToast(`Beli ${db.name} -${fmtCurrency(price)}`);saveGame(this.player);
      }
    }else{
      const inv=p.sortedInventory('name');
      if(inv.length===0)return;
      this.shopIndex=clamp(this.shopIndex,0,inv.length-1);
      if(this.input.pressed('up'))this.shopIndex=(this.shopIndex+inv.length-1)%inv.length;
      if(this.input.pressed('down'))this.shopIndex=(this.shopIndex+1)%inv.length;
      if(this.input.pressed('a')){
        const it=inv[this.shopIndex];if(!it)return;
        const db=ITEM_DB[it.id];if(!db)return;
        p.removeItem(it.id,1);const gain=db.sell*SELL_MULT;p.currency+=gain;
        this.showToast(`Jual ${db.name} +${fmtCurrency(gain)}`);
        const ni=p.sortedInventory('name');this.shopIndex=clamp(this.shopIndex,0,Math.max(0,ni.length-1));
        saveGame(this.player);
      }
    }
  }
